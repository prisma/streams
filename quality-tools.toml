# A fork pin (docs/quality/dependencies.md): `rev` must be `base` plus exactly
# the commits `carries` lists, in order, each an upstream PR's patch, a fork
# commit FORK.md lists by its upstream PR or issue, or the fork's docs commit;
# config.py checks the history (gate changes decided by the lead, 2026-10-30
# and 2026-11-01).
[foyer]
git = "https://github.com/sorenbs/foyer.git"
rev = "87d21072a1926106f983c6b5f01527cf7e635cee"
upstream = "https://github.com/foyer-rs/foyer.git"
base = "dd46245c45071d1036331e4e2c48e15386017b96"
carries = [
  { pr = 1345, commit = "d136c08bb565cd29a7a95cd07b2b321a66e1d64b" },
  { pr = 1382, commit = "ce21552d0dd5b2e91258fcd1d9af330d1fc977b3" },
]

