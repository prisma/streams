[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is an unmaintained but complete transitive serialization dependency of SlateDB 0.14.1/foyer; no vulnerability or safe compatible replacement exists" },
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time macro dependency of SlateDB 0.14.1/foyer; no vulnerability or compatible upstream replacement exists" },
  { id = "RUSTSEC-2023-0071", reason = "the service performs RSA public-key JWT verification only and never loads or operates on an RSA private key, so the private-key timing oracle is unreachable" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
deny = [
  { crate = "openssl", reason = "the service uses the rustls-only TLS stack" },
  { crate = "native-tls", reason = "platform TLS must not depend on host OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
