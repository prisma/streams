[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is an unmaintained but complete transitive serialization dependency of SlateDB 0.14.1/foyer; no vulnerability or safe compatible replacement exists" },
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time macro dependency of SlateDB 0.14.1/foyer; no vulnerability or compatible upstream replacement exists" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots CA-bundle data (permissive data license).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
deny = [
  { crate = "openssl", reason = "the service uses the rustls-only TLS stack" },
  { crate = "native-tls", reason = "platform TLS must not depend on host OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The ONE intentional git dependency: upstream SlateDB at an exact,
# ledgered rev (Cargo.toml documents the pin; docs/SLATEDB-FORK.md the
# history). Everything else must come from crates.io.
allow-git = ["https://github.com/slatedb/slatedb"]
