[package]
name = "awsbench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate (not part of the server build): the AWS SDK dependency
# tree stays out of the service's cargo-deny surface. Gate runs build it
# explicitly for the comparison campaign only.
# Its own workspace root: the server's manifest became a workspace on
# 2026-09-08 (a1d9dabf) and cargo then refused to build this crate from
# inside the tree ("current package believes it's in a workspace").
[workspace]

[dependencies]
# The AWS clients use the SDK's current HTTPS client (`default-https-client`:
# hyper 1 and rustls 0.23), not the legacy `rustls` connector (hyper 0.14 and
# rustls 0.21); aws-config's STS client follows its selection.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kinesis = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
