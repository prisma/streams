\* TLA-005 CLOSE shape: A (final append), its retry R and C, a producer-less
\* empty AppendFinish::Close request (CommitOp::Close): C either closes the
\* stream by writing (no record) or, on a closed stream, is the idempotent close
\* success (no-write).
\* Here D3 is independent of D1/D2: C closes without record "a".
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "C"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANTS
    TypeOK
    PendingSortedInv
    AtMostOneSettlement
    D1_AppendAckDurable
    D2_DuplicateAckDurable
    D3_CloseAckDurable
    D4_RefusalDurable
    D7_ExactlyOnce
    D8_ReplyBinding
    D10_RefusedNeverAppears
    PubVisibleDurable
    AckAfterVisibility
