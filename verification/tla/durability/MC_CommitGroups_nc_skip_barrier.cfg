\* TLA-005 negative control "nc_skip_barrier" (small shape): a no-write transaction skips the prior barrier.
\* ONE target invariant so the verdict is attributable: D2_DuplicateAckDurable
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- MutAttachSkipBarrier
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    D2_DuplicateAckDurable
