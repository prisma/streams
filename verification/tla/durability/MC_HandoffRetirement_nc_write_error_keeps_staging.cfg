\* TLA-006 negative control "nc_write_error_keeps_staging" (small shape): the pre-fix committer, which answers a failed db.write Internal and keeps staging.
\* ONE target so the verdict is attributable: SuccessIsDurable
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- MutWriteErrorKeepsStaging
INVARIANT
    SuccessIsDurable
