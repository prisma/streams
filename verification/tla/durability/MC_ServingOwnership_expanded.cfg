\* TLA-011 baseline, expanded shape, managed FLEET mode: adds the plain append
\* X (a different record that could overwrite an acknowledged offset) and a
\* second attempt of the retry R; three engine incarnations, one crash, one
\* override move, one ambiguous WAL PUT, abandoned storage closes.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R", "X"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 2
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANTS
    TypeOK
    PendingSortedInv
    AckedDurable
    ExactlyOnceAcrossOwners
    HigherEpochCoversAcks
    DataUnderWriterAuthority
