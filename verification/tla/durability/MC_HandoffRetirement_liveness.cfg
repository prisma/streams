\* TLA-006 liveness on the small shape, NO symmetry reduction.
\* Fair: committer (take, write, refused write on a closed Db, publish, attach),
\* completer, acker close on close_reason, stranded rejection, WAL landing while
\* the WAL flusher lives, durable_seq reporting while the Db is open.
\* Unfair and bounded (so they eventually cease): fatal WAL failure, db.write
\* errors before or after apply, external retirement, committer abort,
\* requester cancellation, issuing.
SPECIFICATION LiveSpec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
PROPERTY
    AllIssuedSettle
