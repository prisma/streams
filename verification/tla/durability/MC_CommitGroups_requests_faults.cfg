\* TLA-005 expanded shape (2), REQUESTS UNDER WRITE FAULTS: A, R, X and Y with
\* one db.write error (before or after apply), one fatal WAL failure and one
\* external retirement, no restart (the reused refusal combined with every
\* in-incarnation fault).
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X", "Y"}
    MaxRestarts = 0
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANTS
    TypeOK
    PendingSortedInv
    AtMostOneSettlement
    D1_AppendAckDurable
    D2_DuplicateAckDurable
    D3_CloseAckDurable
    D4_RefusalDurable
    D7_ExactlyOnce
    D8_ReplyBinding
    D10_RefusedNeverAppears
    PubVisibleDurable
    AckAfterVisibility
