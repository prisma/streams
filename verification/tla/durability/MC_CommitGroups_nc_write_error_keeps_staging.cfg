\* TLA-005 negative control "nc_write_error_keeps_staging" (small shape): the
\* pre-fix committer, which answers a failed db.write Internal and keeps staging.
\* ONE target invariant so the verdict is attributable: D2_DuplicateAckDurable
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- MutWriteErrorKeepsStaging
INVARIANT
    D2_DuplicateAckDurable
