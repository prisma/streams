\* TLA-005 small shape: original append A, its retry R, the state-dependent
\* refusal X; one restart, one fatal WAL failure, one external retirement and
\* one db.write error (before or after apply). After a post-apply error default
\* reads stay open until closed_result is written (the pinned SlateDB order), so
\* this shape contains the TLA-005-F5 duplicate schedule.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANTS
    TypeOK
    PendingSortedInv
    AtMostOneSettlement
    D1_AppendAckDurable
    D2_DuplicateAckDurable
    D3_CloseAckDurable
    D4_RefusalDurable
    D7_ExactlyOnce
    D8_ReplyBinding
    D10_RefusedNeverAppears
    PubVisibleDurable
    AckAfterVisibility
