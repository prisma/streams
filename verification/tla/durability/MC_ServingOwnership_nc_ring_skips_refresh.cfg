\* TLA-011 negative control "nc_ring_skips_refresh" (small shape): an opener the ring names as owner skips the final manifest refresh.
\* ONE target invariant so the verdict is attributable: HigherEpochCoversAcks
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- MutRefreshByRing
INVARIANT
    HigherEpochCoversAcks
