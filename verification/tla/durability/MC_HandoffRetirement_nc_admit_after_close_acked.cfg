\* TLA-006 negative control "nc_admit_after_close_acked" (small shape): a batch admitted after the close boundary is claimed and acknowledged by the retired engine.
\* ONE target so the verdict is attributable: LateSuccessWasClaimedLive
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- MutPublicationAlways
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- MutTakeIgnoreTerminal
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    LateSuccessWasClaimedLive
