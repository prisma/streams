\* TLA-011 baseline, SINGLE-INSTANCE / no-ring mode: effective_owner() is None
\* on both nodes forever, so both may open and serve (a writer-epoch war);
\* safety must then rest on the storage fencing contract alone. A, R, X; three
\* engine incarnations; one crash; one ambiguous WAL PUT; no ring moves exist.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "single"
    Reqs = {"A", "R", "X"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 0
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANTS
    TypeOK
    PendingSortedInv
    AckedDurable
    ExactlyOnceAcrossOwners
    HigherEpochCoversAcks
    DataUnderWriterAuthority
