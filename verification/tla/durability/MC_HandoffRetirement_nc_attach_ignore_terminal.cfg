\* TLA-006 negative control "nc_attach_ignore_terminal" (small shape): attach ignores terminal, so a no-write verdict decided after retirement succeeds.
\* ONE target so the verdict is attributable: LateSuccessWasClaimedLive
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- MutAttachIgnoreTerminal
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    LateSuccessWasClaimedLive
