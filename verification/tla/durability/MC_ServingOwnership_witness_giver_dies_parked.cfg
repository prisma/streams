\* WITNESS Witness_GiverDiesParked (small shape): the giver of a planned move dies with its engine parked, before the document changed.
\* Expected: TLC reports Witness_GiverDiesParked violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
    FlipGate <- RealFlipGate
INVARIANT
    Witness_GiverDiesParked
