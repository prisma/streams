\* TLA-006 baseline, small shape: three requests (two writers, one no-write
\* verdict), one fatal WAL failure, one db.write error on an open Db (before or
\* after apply), one external retirement, one committer abort after the grace.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANTS
    TypeOK
    PendingSortedInv
    SettledAtMostOnce
    SuccessIsDurable
    StrandedNeverSucceeds
    LateSuccessWasClaimedLive
    RetiredEngineFrozen
    RetiredHandoffEmpty
