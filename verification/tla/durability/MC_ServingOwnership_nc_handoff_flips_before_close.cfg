\* TLA-011 negative control "nc_handoff_flips_before_close" (small shape): a planned move writes the document while its engine is still parked, before the close.
\* ONE target invariant so the verdict is attributable: HandOffFencesNothing
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
    FlipGate <- MutFlipBeforeClose
INVARIANT
    HandOffFencesNothing
