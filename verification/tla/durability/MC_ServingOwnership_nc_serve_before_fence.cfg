\* TLA-011 negative control "nc_serve_before_fence" (small shape): the new owner serves after the epoch CAS without its fence WAL.
\* ONE target invariant so the verdict is attributable: HigherEpochCoversAcks
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- MutReadyGateNoFence
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    HigherEpochCoversAcks
