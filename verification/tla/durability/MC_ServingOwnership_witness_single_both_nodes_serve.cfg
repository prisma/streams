\* WITNESS Witness_TakeoverInstalls (single shape): without a ring (single/bootstrapping mode) both nodes open and serve in turn.
\* Expected: TLC reports Witness_TakeoverInstalls violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "single"
    Reqs = {"A", "R", "X"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 0
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    Witness_TakeoverInstalls
