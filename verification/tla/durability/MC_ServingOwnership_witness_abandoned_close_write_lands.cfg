\* WITNESS Witness_AbandonedCloseWriteLands (small shape): a storage close abandoned with a PUT in flight: the PUT lands later.
\* Expected: TLC reports Witness_AbandonedCloseWriteLands violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    Witness_AbandonedCloseWriteLands
