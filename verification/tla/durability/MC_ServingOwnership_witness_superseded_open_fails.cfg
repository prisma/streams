\* WITNESS Witness_SupersededOpenFails (small shape): an opener whose epoch was superseded fails its final manifest refresh.
\* Expected: TLC reports Witness_SupersededOpenFails violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    Witness_SupersededOpenFails
