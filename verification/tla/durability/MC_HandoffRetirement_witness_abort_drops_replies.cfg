\* WITNESS Witness_AbortDropsReplies: a committer aborted after the worker grace settles its requests by dropping them.
\* Expected: TLC reports Witness_AbortDropsReplies violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    Witness_AbortDropsReplies
