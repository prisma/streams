\* TLA-006 baseline, expanded shape: four requests (two writers, two no-write
\* verdicts, so two dependent attachments can share one barrier), one fatal
\* WAL failure, one db.write error (before or after apply), two external
\* retirement triggers, one committer abort.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3", "r4"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 2
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANTS
    TypeOK
    PendingSortedInv
    SettledAtMostOnce
    SuccessIsDurable
    StrandedNeverSucceeds
    LateSuccessWasClaimedLive
    RetiredEngineFrozen
    RetiredHandoffEmpty
