\* WITNESS Witness_DuplicateResolvedByNewOwner (small shape): the retry R is answered as a duplicate by a different engine than the one that wrote A.
\* Expected: TLC reports Witness_DuplicateResolvedByNewOwner violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    Witness_DuplicateResolvedByNewOwner
