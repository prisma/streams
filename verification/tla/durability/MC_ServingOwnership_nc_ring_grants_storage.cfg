\* TLA-011 negative control "nc_ring_grants_storage" (expanded shape): ring preference stands in for the WAL put-if-absent fence (needs X: with only A and R an overwritten offset would still hold record a).
\* ONE target invariant so the verdict is attributable: AckedDurable
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R", "X"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 2
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- MutLandByRing
    RefreshOp <- RealRefresh
INVARIANT
    AckedDurable
