\* WITNESS Witness_CancelledRequesterSettled: a requester that cancelled still has its batch settled server-side.
\* Expected: TLC reports Witness_CancelledRequesterSettled violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- RealStranded
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    Witness_CancelledRequesterSettled
