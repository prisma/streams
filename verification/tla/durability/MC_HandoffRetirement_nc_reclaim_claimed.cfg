\* TLA-006 negative control "nc_reclaim_claimed" (small shape): retirement also takes the groups the completer already claimed.
\* ONE target so the verdict is attributable: SettledAtMostOnce
SPECIFICATION Spec
CONSTANTS
    Reqs = {"r1", "r2", "r3"}
    Writers = {"r1", "r3"}
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    MaxAbort = 1
    PublicationOp <- RealPublication
    StrandedOp <- MutStrandedReclaim
    AttachOp <- RealAttach
    TakeOp <- RealTake
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    SettledAtMostOnce
