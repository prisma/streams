\* TLA-005 negative control "nc_publish_early" (small shape): the durable tail is published at registration.
\* ONE target invariant so the verdict is attributable: PubVisibleDurable
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- MutPublishVisibleAtRegistration
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    PubVisibleDurable
