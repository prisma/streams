\* TLA-011 negative control "nc_ring_authorizes" (small shape): durability-evidence control: acks without durable_seq while the view says mine.
\* ONE target invariant so the verdict is attributable: AckedDurable
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- MutClaimByRing
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    AckedDurable
