\* TLA-011 baseline, small shape, managed FLEET mode: two nodes, one shard,
\* one override move, stale per-node views, A and its retry R (one attempt),
\* up to three engine incarnations, one node crash (restart bootstraps with no
\* ring), one ambiguous WAL PUT (landed, reply lost, retry reports Fenced),
\* abandoned storage closes with a PUT in flight.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANTS
    TypeOK
    PendingSortedInv
    AckedDurable
    ExactlyOnceAcrossOwners
    HigherEpochCoversAcks
    DataUnderWriterAuthority
