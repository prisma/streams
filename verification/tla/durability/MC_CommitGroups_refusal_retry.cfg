\* TLA-005 REFUSAL-RETRY shape: A, Y (same producer seq, other hash) and S,
\* Y's retry after Y's outcome is unknown to its client. A definitive refusal
\* can now be followed by the same operation, so D10 can fail. With the pinned
\* post-apply read window this shape contains the TLA-005-F5 reused-refusal
\* schedule.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "Y", "S"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANTS
    TypeOK
    PendingSortedInv
    AtMostOneSettlement
    D1_AppendAckDurable
    D2_DuplicateAckDurable
    D3_CloseAckDurable
    D4_RefusalDurable
    D7_ExactlyOnce
    D8_ReplyBinding
    D10_RefusedNeverAppears
    PubVisibleDurable
    AckAfterVisibility
