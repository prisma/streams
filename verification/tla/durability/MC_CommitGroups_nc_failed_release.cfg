\* TLA-005 negative control "nc_failed_release" (small shape): a failed (retired) group releases its dependent verdicts.
\* ONE target invariant so the verdict is attributable: D4_RefusalDurable
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- MutReleaseStranded
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    D4_RefusalDurable
