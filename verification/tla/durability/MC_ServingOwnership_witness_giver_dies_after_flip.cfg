\* WITNESS Witness_GiverDiesAfterFlip (small shape): the giver of a planned move dies after the document changed, before its hold ended.
\* Expected: TLC reports Witness_GiverDiesAfterFlip violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
    FlipGate <- RealFlipGate
INVARIANT
    Witness_GiverDiesAfterFlip
