\* WITNESS Witness_TakeoverInstalls (small shape): an engine on the other node begins serving (a move / takeover completes).
\* Expected: TLC reports Witness_TakeoverInstalls violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1", "n2"}
    Mode = "fleet"
    Reqs = {"A", "R"}
    InitOwner = "n1"
    MaxEngines = 3
    MaxCrashes = 1
    MaxMoves = 1
    MaxTries = 1
    AmbiguousPut = TRUE
    ClaimOp <- RealClaim
    ReadyGate <- RealReadyGate
    LandOp <- RealLand
    RefreshOp <- RealRefresh
INVARIANT
    Witness_TakeoverInstalls
