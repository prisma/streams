\* TLA-005 negative control "nc_idem_close_unbarriered" (close shape): an idempotent close (no write) is answered without the prior barrier.
\* ONE target invariant so the verdict is attributable: D3_CloseAckDurable
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "C"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- MutAttachSkipBarrierForIdempotentClose
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    D3_CloseAckDurable
