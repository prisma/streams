\* TLA-005 negative control "nc_reply_before_visible" (small shape): the dispatcher acknowledges before publishing the durable tail/ring.
\* ONE target invariant so the verdict is attributable: AckAfterVisibility
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- MutReplyBeforeVisible
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    AckAfterVisibility
