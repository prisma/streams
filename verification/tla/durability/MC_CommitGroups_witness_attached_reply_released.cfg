\* WITNESS Witness_AttachedReplyReleased (small shape): a verdict attached to a pending group is later received as a success.
\* Expected: TLC reports Witness_AttachedReplyReleased violated on the UNMODIFIED model.
SPECIFICATION Spec
CONSTANTS
    Reqs = {"A", "R", "X"}
    MaxRestarts = 1
    MaxWalFail = 1
    MaxWriteFail = 1
    MaxRetire = 1
    AttachOp <- RealAttach
    PublishVisibleOp <- RealPublishVisible
    StrandedResultOp <- RealStrandedResult
    ReplyPhases <- RealReplyPhases
    WriteErrorRetires <- RealWriteErrorRetires
INVARIANT
    Witness_AttachedReplyReleased
