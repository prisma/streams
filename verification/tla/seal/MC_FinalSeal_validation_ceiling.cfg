\* TLA-003 baseline, shape V5 (ceiling skew; B owns the shard at start): X's original on A;
\* its exact retry on B, over B's record ceiling (a deferred refusal: no renewal, and no
\* release since the retry did not install the claim; TLA-003-F4/F5 fix); one more exact
\* retry; S a plain seal.  One engine replacement (ownership may move), one cancellation.
\* Every safety property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- V5FinalOps
    PlainOps <- V5PlainOps
    AppendOps <- VAppendOps
    Surface <- VSurface
    Content <- VContent
    Producer <- VProducer
    SeqOf <- VSeqOf
    Slots <- V5Slots
    Budget <- V5Budget
    Unbounded <- MCNoUnbounded
    Validity <- V5Validity
    Procs <- TwoProcs
    HomeOf <- HomeSplitX
    InitOwner = B
    MaxGen = 5
    MaxCrash = 0
    MaxRetire = 1
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
