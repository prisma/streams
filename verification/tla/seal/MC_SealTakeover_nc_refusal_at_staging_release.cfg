    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudget
    Unbounded <- MCNoUnbounded
    Validity <- MCValidity
    Procs <- MCOneProc
    HomeOf <- MCHomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 1
    MaxCancel = 0
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 1
    MaxClaimLoop = 0
    WitnessMode = FALSE
CONSTANT ImmediateRefusal <- RefusalAtStaging
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    ReleaseOnlyWhenUndeliverable
