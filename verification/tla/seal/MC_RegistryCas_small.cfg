\* TLA-001 baseline (small): M1, M2 race on E1 while D tombstones it and recreates E2;
\* M5 (validated against E2) races them on the replacement; M3 on project P2.
\* 2 attempts per call; one lost reply, one failed dispatch, one missing ETag, one
\* failed read, one retry of an ambiguous recreate.
CONSTANTS
    M1 = M1  M2 = M2  M3 = M3  M5 = M5  D = D  P1 = P1  P2 = P2  E1 = E1  E2 = E2  E3 = E3
    NONE = NONE
    Mutators <- MCMutators
    Deleter = D
    Paths <- MCPaths
    Epochs <- MCEpochs
    PathOf <- MCPathOf
    InitEpoch <- MCInitEpoch
    Expected <- MCExpected
    FreshEpoch = E2
    MaxAttempts = 2
    MaxGen = 3
    MaxLostReply = 1
    MaxDispatchFail = 1
    MaxMissingEtag = 1
    MaxReadFail = 1
    MaxRecreateRetry = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    UniqueAllocation
    IncarnationFenced
    AllocatorCountsWrites
    AttemptLocalResult
    NegativeOutcomesWroteNothing
