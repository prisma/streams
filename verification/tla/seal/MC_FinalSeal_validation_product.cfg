\* TLA-003 baseline, shape VP (product ceiling skew; B owns the shard at start): Y's original
\* on A; its exact retry on B, over B's record ceiling, is refused before any claim; one more
\* exact retry; S a plain seal.  One engine replacement, one cancellation.  Every safety
\* property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- VPFinalOps
    PlainOps <- V5PlainOps
    AppendOps <- VAppendOps
    Surface <- VSurface
    Content <- VContent
    Producer <- VProducer
    SeqOf <- VSeqOf
    Slots <- VPSlots
    Budget <- VPBudget
    Unbounded <- MCNoUnbounded
    Validity <- VPValidity
    Procs <- TwoProcs
    HomeOf <- HomeSplitY
    InitOwner = B
    MaxGen = 5
    MaxCrash = 0
    MaxRetire = 1
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
