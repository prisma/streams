\* TLA-002 KNOWN DEFECT (TLA-002-F2) on the one-instance replacement shape with one fence group
\* staged before its durability: the engine is replaced before the fence group is durable,
\* the older attempt's final commits on the new engine, and the newer attempt's refusal then
\* releases the claim although the operation's record is durable.
\* Expect ReleaseOnlyWhenUndeliverable violated.
CONSTANTS
    P0 = P0  T1 = T1  T2 = T2  A = A  B = B  C0 = C0  C1 = C1
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- MCFinalOps
    PlainOps <- MCPlainOps
    AppendOps <- MCAppendOps
    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudget
    Unbounded <- MCNoUnbounded
    Validity <- MCValidity
    Procs <- MCOneProc
    HomeOf <- MCHomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 1
    MaxCancel = 0
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 1
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    ReleaseOnlyWhenUndeliverable
