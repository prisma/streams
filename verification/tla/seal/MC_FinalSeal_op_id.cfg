\* TLA-003 baseline, shape OP: raw close-with-content X and a raw append N1 without
\* Stream-Closed, both without producer headers and with the same bytes (N1 has X's semantic
\* operation id); S a plain seal; X may retry once.  One crash, one cancellation.  Every
\* safety property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- OPFinalOps
    PlainOps <- OPPlainOps
    AppendOps <- OPAppendOps
    Surface <- OPSurface
    Content <- OPContent
    Producer <- OPProducer
    SeqOf <- OPSeqOf
    Slots <- OPSlots
    Budget <- OPBudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
