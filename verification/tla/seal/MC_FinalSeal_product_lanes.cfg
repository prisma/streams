\* TLA-003 baseline, shape P: product seal-with-final X on client producer (L, 0), two
\* requests; N1 product append and N2 raw append on (L, 0) with the same bytes; S plain seal.
\* One crash, one cancellation, one timeout.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- PFinalOps
    PlainOps <- PPlainOps
    AppendOps <- PAppendOps
    Surface <- PSurface
    Content <- PContent
    Producer <- PProducer
    SeqOf <- PSeqOf
    Slots <- PSlots
    Budget <- PBudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 1
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    InstallOnlyOverOwedClaim
    Structural
