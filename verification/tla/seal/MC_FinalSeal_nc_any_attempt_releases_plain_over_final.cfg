    NONE = NONE  PLAIN = PLAIN
    FinalOps <- V5FinalOps
    PlainOps <- V5PlainOps
    AppendOps <- VAppendOps
    Surface <- VSurface
    Content <- VContent
    Producer <- VProducer
    SeqOf <- VSeqOf
    Slots <- V5Slots
    Budget <- V5Budget
    Unbounded <- MCNoUnbounded
    Validity <- V5Validity
    Procs <- TwoProcs
    HomeOf <- HomeSplitX
    InitOwner = B
    MaxGen = 5
    MaxCrash = 0
    MaxRetire = 1
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
CONSTANT RefusalReleases <- AnyAttemptReleases
SPECIFICATION Spec
CONSTRAINT GenBound
