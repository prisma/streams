\* TLA-003 NEGATIVE CONTROL (TLA-003-F5 pre-fix) on shape V5:
\* RefusalReleases <- AnyAttemptReleases (every attempt's definitive refusal releases, not only
\* the installing attempt's): after the segment closed without a claim, a plain :seal installs, re-closes
\* and publishes Sealed over X's committed final record.
\* Expect PlainCannotCompleteOwedFinal violated.
