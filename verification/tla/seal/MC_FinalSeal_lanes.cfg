\* TLA-003 baseline, shape A: raw close-with-content X at producer (L, 1), two requests; N0
\* its predecessor (L, 0), possibly in flight; N1 a non-closing raw append on (L, 1) with X's
\* bytes; S a plain seal.  One crash, one cancellation, one timeout.  Every safety property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- AFinalOps
    PlainOps <- APlainOps
    AppendOps <- AAppendOps
    Surface <- ASurface
    Content <- AContent
    Producer <- AProducer
    SeqOf <- ASeqOf
    Slots <- ASlots
    Budget <- ABudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 1
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    InstallOnlyOverOwedClaim
    Structural
