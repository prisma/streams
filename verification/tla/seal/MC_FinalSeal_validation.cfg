\* TLA-003 baseline, shape V (one instance): X raw close-with-content, two concurrent
\* requests; Y product seal-with-final over the record ceiling (refused before its claim);
\* Z product refused by the pre-intent checks.  One crash, one cancellation.  Every safety
\* property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- VFinalOps
    PlainOps <- VPlainOps
    AppendOps <- VAppendOps
    Surface <- VSurface
    Content <- VContent
    Producer <- VProducer
    SeqOf <- VSeqOf
    Slots <- VSlots
    Budget <- VBudget
    Unbounded <- MCNoUnbounded
    Validity <- VValidity
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    InstallOnlyOverOwedClaim
    Structural
