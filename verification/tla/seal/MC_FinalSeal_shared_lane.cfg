\* TLA-003 baseline, shape SL: raw close-with-content X and product seal-with-final Y
\* without producer headers and with the same bytes (one synthetic lane, two operation
\* ids), two requests each; S plain seal.  One crash, one cancellation, one timeout.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- SLFinalOps
    PlainOps <- SLPlainOps
    AppendOps <- SLAppendOps
    Surface <- SLSurface
    Content <- SLContent
    Producer <- SLProducer
    SeqOf <- SLSeqOf
    Slots <- SLSlots
    Budget <- SLBudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 1
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
