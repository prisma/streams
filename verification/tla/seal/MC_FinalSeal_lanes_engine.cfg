\* TLA-003 baseline, engine-fault shape A2: X's two requests on two concurrent slots, the
\* exact retry handled by instance B (A owns the shard at start); one engine replacement
\* (moving the shard to either instance, or away and back; the head group may become durable
\* while answered Moved) and one enqueue failure.  No crash.  Every safety property, plus
\* HandlersProgress.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- AFinalOps
    PlainOps <- APlainOps
    AppendOps <- AAppendOps
    Surface <- ASurface
    Content <- AContent
    Producer <- AProducer
    SeqOf <- ASeqOf
    Slots <- ASlots2
    Budget <- ABudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- TwoProcs
    HomeOf <- HomeSplitX
    InitOwner = A
    MaxGen = 5
    MaxCrash = 0
    MaxRetire = 1
    MaxCancel = 0
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 1
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
    HandlersProgress
