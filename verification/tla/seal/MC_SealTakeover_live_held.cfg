\* TLA-002 liveness as live_small, with one fence group staged before its durability
\* (MaxHeldFence = 1): the TLA-002-F2 window does not prevent the collection from sealing.
CONSTANTS
    P0 = P0  T1 = T1  T2 = T2  A = A  B = B  C0 = C0  C1 = C1
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- MCFinalOps
    PlainOps <- MCPlainOps
    AppendOps <- MCAppendOps
    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudgetLiveP0
    Unbounded <- MCRecoveryActor
    Validity <- MCValidity
    Procs <- MCOneProc
    HomeOf <- MCHomeA
    InitOwner = A
    MaxGen = 99
    MaxCrash = 1
    MaxRetire = 1
    MaxCancel = 0
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 1
    MaxClaimLoop = 6
    WitnessMode = FALSE
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    EventuallySealed
