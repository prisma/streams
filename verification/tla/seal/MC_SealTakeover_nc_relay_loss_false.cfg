\* TLA-002 NEGATIVE CONTROL (F1-a, the relayed fence's loss mapping) on the two-instance
\* crash shape (the xproc baseline's constants): TFence <- RelayLossAnswersFalse (a relay
\* lost before it lands is answered "not closed", nothing queued at the owner).
\* Expect ClosureAuthorized violated.
CONSTANTS
    P0 = P0  T1 = T1  T2 = T2  A = A  B = B  C0 = C0  C1 = C1
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- MCFinalOps
    PlainOps <- MCPlainOps
    AppendOps <- MCAppendOps
    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudget
    Unbounded <- MCNoUnbounded
    Validity <- MCValidity
    Procs <- MCTwoProcs
    HomeOf <- MCHomeSplit
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 0
    MaxTimeout = 1
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
CONSTANT TFence <- RelayLossAnswersFalse
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    ClosureAuthorized
