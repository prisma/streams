\* TLA-003 baseline, shape V5A: V5 with A owning the shard at start, so X's original on A can
\* commit before its exact retry on B (over B's record ceiling: deferred, not renewed) reaches
\* B's committer after ownership moves; the retry is then answered the duplicate of the
\* committed final and marks it under the generation it observed.  One engine replacement,
\* one cancellation.  Every safety property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- V5FinalOps
    PlainOps <- V5PlainOps
    AppendOps <- VAppendOps
    Surface <- VSurface
    Content <- VContent
    Producer <- VProducer
    SeqOf <- VSeqOf
    Slots <- V5Slots
    Budget <- V5Budget
    Unbounded <- MCNoUnbounded
    Validity <- V5Validity
    Procs <- TwoProcs
    HomeOf <- HomeSplitX
    InitOwner = A
    MaxGen = 5
    MaxCrash = 0
    MaxRetire = 1
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
