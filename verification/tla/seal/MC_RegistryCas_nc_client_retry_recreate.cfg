\* TLA-001 negative control (pre-fix client retries): a committed conditional PUT is answered
\* Precondition; a recreate re-reads its own committed replacement and is answered declined. Expect RecreateAnswerTruthful violated.
CONSTANTS
    M1 = M1  M2 = M2  M3 = M3  M5 = M5  D = D  P1 = P1  P2 = P2  E1 = E1  E2 = E2  E3 = E3
    NONE = NONE
    Mutators <- MCMutators
    Deleter = D
    Paths <- MCPaths
    Epochs <- MCEpochs
    PathOf <- MCPathOf
    InitEpoch <- MCInitEpoch
    Expected <- MCExpected
    FreshEpoch = E2
    MaxAttempts = 2
    MaxGen = 3
    MaxLostReply = 1
    MaxDispatchFail = 1
    MaxMissingEtag = 1
    MaxReadFail = 1
    MaxRecreateRetry = 1
CONSTANT CommittedAnsweredPrecondition <- ClientRetriesConditional
SPECIFICATION Spec
INVARIANT
    RecreateAnswerTruthful
