\* TLA-002 liveness under storage and client faults, one instance.  T2 retries forever; P0
\* issues ONE request.  Faults that cease: one registry fault, one enqueue failure, one
\* client cancellation (P0's final may be orphaned in the queue), one APPEND_TIMEOUT.
\* Fairness as in live_small.
CONSTANTS
    P0 = P0  T1 = T1  T2 = T2  A = A  B = B  C0 = C0  C1 = C1
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- MCFinalOps
    PlainOps <- MCPlainOps
    AppendOps <- MCAppendOps
    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudgetLiveP0
    Unbounded <- MCRecoveryActor
    Validity <- MCValidity
    Procs <- MCOneProc
    HomeOf <- MCHomeA
    InitOwner = A
    MaxGen = 99
    MaxCrash = 0
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 1
    MaxRegFault = 1
    MaxEnqFail = 1
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 6
    WitnessMode = FALSE
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    EventuallySealed
