\* TLA-002 liveness, one instance.  T2 (plain :seal) is the recovery actor and retries
\* forever.  P0 issues ONE request and vanishes (its final may still be in flight, queued or
\* pre-queue); T1 is silent.  Faults cease: one process crash, one engine replacement.
\* Weak fairness only on the committer, each handler's own protocol step, lease time and
\* T2's request issue.  MaxClaimLoop = 6 (production).  No constraint, no symmetry.
CONSTANTS
    P0 = P0  T1 = T1  T2 = T2  A = A  B = B  C0 = C0  C1 = C1
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- MCFinalOps
    PlainOps <- MCPlainOps
    AppendOps <- MCAppendOps
    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudgetLiveP0
    Unbounded <- MCRecoveryActor
    Validity <- MCValidity
    Procs <- MCOneProc
    HomeOf <- MCHomeA
    InitOwner = A
    MaxGen = 99
    MaxCrash = 1
    MaxRetire = 1
    MaxCancel = 0
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 6
    WitnessMode = FALSE
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
PROPERTIES
    EventuallySealed
