\* TLA-003 NEGATIVE CONTROL (the behaviour before "Only a close can resume an owed final") on
\* shape OP: ResumesOwedFinal <- AnyRequestResumes.  N1, a plain append with X's bytes, passes as
\* X's exact retry while X's claim is owed: no Sealing refusal, the claim is renewed, and N1's
\* record lands under the renewed generation (X's own final can land after it).
\* Expect SealingRefusesNewAppends violated.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- OPFinalOps
    PlainOps <- OPPlainOps
    AppendOps <- OPAppendOps
    Surface <- OPSurface
    Content <- OPContent
    Producer <- OPProducer
    SeqOf <- OPSeqOf
    Slots <- OPSlots
    Budget <- OPBudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
CONSTANT ResumesOwedFinal <- AnyRequestResumes
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    SealingRefusesNewAppends
