\* TLA-002 baseline, two-instance crash shape with one fence group staged before its
\* durability (MaxHeldFence = 1): every safety property except the two TLA-002-F2 violates in
\* this shape (ClosureAuthorized, PlainCannotCompleteOwedFinal).
CONSTANTS
    P0 = P0  T1 = T1  T2 = T2  A = A  B = B  C0 = C0  C1 = C1
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- MCFinalOps
    PlainOps <- MCPlainOps
    AppendOps <- MCAppendOps
    Surface <- MCSurface
    Content <- MCContent
    Producer <- MCProducer
    SeqOf <- MCSeqOf
    Slots <- MCSlots
    Budget <- MCBudget
    Unbounded <- MCNoUnbounded
    Validity <- MCValidity
    Procs <- MCTwoProcs
    HomeOf <- MCHomeSplit
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 0
    MaxTimeout = 0
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 1
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    SealedFinalHasItsRecord
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    InstallOnlyOverOwedClaim
    Structural
