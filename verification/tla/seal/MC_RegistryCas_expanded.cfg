\* TLA-001 expanded baseline: the production retry bound (5 attempts); three
\* stale-incarnation racers (M1, M2, M4 on E1) and two replacement racers (M5,
\* M6 on E2) on one name and key while D tombstones and recreates it; two lost
\* replies, two failed dispatches, two missing ETags, one failed read, one retry
\* of an ambiguous recreate.
CONSTANTS
    M1 = M1  M2 = M2  M4 = M4  M5 = M5  M6 = M6  D = D  P1 = P1  P2 = P2  E1 = E1  E2 = E2  E3 = E3
    NONE = NONE
    Mutators <- MCMutators
    Deleter = D
    Paths <- MCPaths
    Epochs <- MCEpochs
    PathOf <- MCPathOf
    InitEpoch <- MCInitEpoch
    Expected <- MCExpected
    FreshEpoch = E2
    MaxAttempts = 5
    MaxGen = 3
    MaxLostReply = 2
    MaxDispatchFail = 2
    MaxMissingEtag = 2
    MaxReadFail = 1
    MaxRecreateRetry = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    UniqueAllocation
    IncarnationFenced
    AllocatorCountsWrites
    AttemptLocalResult
    NegativeOutcomesWroteNothing
