\* TLA-003 baseline, shape PW: product seal-with-final X on client producer (L, 0), whose
\* tuple a product append N1 may take first (X is then refused ProducerSeqReused and releases
\* its claim without any lease lapse); raw close-with-content W admitted while X's claim
\* stands.  One crash, one cancellation, one timeout.  Every safety property.
CONSTANTS
    X = X  Y = Y  Z = Z  S = S  W = W  N0 = N0  N1 = N1  N2 = N2  L = L  LX = LX  LY = LY  A = A  B = B  CX = CX  CY = CY  CN = CN
    NONE = NONE  PLAIN = PLAIN
    FinalOps <- PWFinalOps
    PlainOps <- VPlainOps
    AppendOps <- PWAppendOps
    Surface <- PWSurface
    Content <- PWContent
    Producer <- PWProducer
    SeqOf <- PWSeqOf
    Slots <- PWSlots
    Budget <- PWBudget
    Unbounded <- MCNoUnbounded
    Validity <- AllOk
    Procs <- OneProc
    HomeOf <- HomeA
    InitOwner = A
    MaxGen = 5
    MaxCrash = 1
    MaxRetire = 0
    MaxCancel = 1
    MaxTimeout = 1
    MaxRegFault = 0
    MaxEnqFail = 0
    MaxFenceReadFail = 0
    MaxHeldFence = 0
    MaxClaimLoop = 0
    WitnessMode = FALSE
SPECIFICATION Spec
CONSTRAINT GenBound
INVARIANTS
    TypeOK
    ClosureAuthorized
    SealedFinalHasItsRecord
    PlainCannotCompleteOwedFinal
    FenceBarrier
    NewestInstall
    LiveClaimNeverFenced
    QueuedFinalDecidedBeforeReplacement
    SuccessProvesOutcome
    ReleaseOnlyWhenUndeliverable
    FinalClosedTruthful
    IntentOnlyAfterValidation
    SealingRefusesNewAppends
    InstallOnlyOverOwedClaim
    Structural
