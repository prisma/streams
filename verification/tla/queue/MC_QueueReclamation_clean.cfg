\* TLA-QR baseline (clean): small's bounds without reads or crashes, with the cleaner's copies (Cleaner): its gather, its commit under refs and an abandon, beside scheduled sends, folds and the split's recount.
CONSTANTS
    N = 3
    MaxObjs = 2
    Shared = {1}
    PassHints = 1
    PassChunks = 2
    MaxReads = 0
    MaxCrashes = 0
    Rich = TRUE
    Debt = FALSE
    Cleaner = TRUE
    MaxHintId = 8
SPECIFICATION Spec
CONSTRAINT HintBound
INVARIANT
    TypeOK
    NoChunkTrimmedWhileReferencedOrAhead
    RefcountExact
    NoDeleteWhileReferenced
    ReadsServed
    ReclaimedIsABoundary
    IntervalsDisjointAndAboveReclaimed
    CursorBehindEveryHint
    EveryHintHandled
    DebtClearedOnlyAfterACoveringPass
