\* TLA-QD baseline (small): 2 offsets (one range row), ranges of 2, 2 attempts, 1 free release, unlease limit 2, clock 0..3, retention 2, failure retention 1, one unreadable body, one crash.
CONSTANTS
    N = 2
    RangeSize = 2
    MaxAttempts = 2
    FreeReleases = 1
    UnleaseLimit = 2
    MaxClock = 3
    Retention = 2
    FailRetention = 1
    LeaseTime = 1
    MaxUnreadable = 1
    MaxCrashes = 1
SPECIFICATION Spec
CONSTRAINT LeaseBound
INVARIANT
    TypeOK
    NoMessageLost
    NoSendAtOrBelowFrontier
    ReplayedSettleChangesNothing
    NothingOutlivesHardExpiry
    FrontierNeverPassesALiveImmediate
    CancelledNeverLeased
    UnleaseKeepsBudgets
    AccountingExact
    RangeRowsMatch
    PoisonBounded
