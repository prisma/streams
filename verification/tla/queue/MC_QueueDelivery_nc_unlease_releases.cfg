\* TLA-QD negative control (S3b-DESIGN §11.1): an internal unlease spends a release. Expect UnleaseKeepsBudgets violated.
CONSTANTS
    N = 2
    RangeSize = 2
    MaxAttempts = 2
    FreeReleases = 1
    UnleaseLimit = 2
    MaxClock = 3
    Retention = 2
    FailRetention = 1
    LeaseTime = 1
    MaxUnreadable = 1
    MaxCrashes = 1
CONSTANT UnleaseReleases <- MutUnleaseReleases
SPECIFICATION Spec
CONSTRAINT LeaseBound
INVARIANT
    UnleaseKeepsBudgets
