    Shared = {1}
    PassHints = 1
    PassChunks = 2
    MaxReads = 1
    MaxCrashes = 1
    Rich = TRUE
    Debt = FALSE
    Cleaner = FALSE
    MaxHintId = 8
CONSTANT Unreferenced <- MutUnreferenced
SPECIFICATION Spec
CONSTRAINT HintBound
INVARIANT
    NoChunkTrimmedWhileReferencedOrAhead
