\* TLA-QR baseline (small): 3 offsets, two seals (object 1 shared with another stream), one hint and two chunks a pass, one read, one crash, hint ids below 8.
CONSTANTS
    N = 3
    MaxObjs = 2
    Shared = {1}
    PassHints = 1
    PassChunks = 2
    MaxReads = 1
    MaxCrashes = 1
    MaxHintId = 8
SPECIFICATION Spec
CONSTRAINT HintBound
INVARIANT
    TypeOK
    NoChunkTrimmedWhileReferencedOrAhead
    RefcountExact
    NoDeleteWhileReferenced
    ReadsServed
    ReclaimedIsABoundary
    IntervalsDisjointAndAboveReclaimed
    CursorBehindEveryHint
    EveryHintHandled
