\* TLA-QD negative control 7 (S3b-DESIGN §11.1): the lane served from a prepared page behind the frontier. Expect CancelledNeverLeased violated (a message leased first twice).
CONSTANTS
    N = 2
    RangeSize = 2
    MaxAttempts = 2
    FreeReleases = 1
    UnleaseLimit = 2
    MaxClock = 3
    Retention = 2
    FailRetention = 1
    LeaseTime = 1
    MaxUnreadable = 1
    MaxCrashes = 1
CONSTANT LaneServes <- MutLaneServes
SPECIFICATION Spec
CONSTRAINT LeaseBound
INVARIANT
    CancelledNeverLeased
