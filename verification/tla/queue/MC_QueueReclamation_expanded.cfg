\* TLA-QR baseline (expanded): 4 offsets, two seals (object 2 shared with another stream), two hints and two chunks a pass, one read, no crash, hint ids below 10.
CONSTANTS
    N = 4
    MaxObjs = 2
    Shared = {2}
    PassHints = 2
    PassChunks = 2
    MaxReads = 1
    MaxCrashes = 0
    MaxHintId = 10
SPECIFICATION Spec
CONSTRAINT HintBound
INVARIANT
    TypeOK
    NoChunkTrimmedWhileReferencedOrAhead
    RefcountExact
    NoDeleteWhileReferenced
    ReadsServed
    ReclaimedIsABoundary
    IntervalsDisjointAndAboveReclaimed
    CursorBehindEveryHint
    EveryHintHandled
