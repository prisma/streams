\* TLA-QR negative control 2 (S3b-DESIGN §11.2): retirement by coarse counts (open deliveries only). Expect NoChunkTrimmedWhileReferencedOrAhead violated.
CONSTANTS
    N = 3
    MaxObjs = 2
    Shared = {1}
    PassHints = 1
    PassChunks = 2
    MaxReads = 1
    MaxCrashes = 1
    Rich = TRUE
    Debt = FALSE
    MaxHintId = 8
CONSTANT Unreferenced <- MutUnreferencedCoarse
SPECIFICATION Spec
CONSTRAINT HintBound
INVARIANT
    NoChunkTrimmedWhileReferencedOrAhead
