\* TLA-QR baseline (debt): the small bounds without reads or scheduled sends, the acks' debt and the collector's passes explored (Debt).
CONSTANTS
    N = 3
    MaxObjs = 2
    Shared = {1}
    PassHints = 1
    PassChunks = 2
    MaxReads = 0
    MaxCrashes = 1
    Rich = FALSE
    Debt = TRUE
    MaxHintId = 8
SPECIFICATION Spec
CONSTRAINT HintBound
INVARIANT
    TypeOK
    NoChunkTrimmedWhileReferencedOrAhead
    RefcountExact
    NoDeleteWhileReferenced
    ReadsServed
    ReclaimedIsABoundary
    IntervalsDisjointAndAboveReclaimed
    CursorBehindEveryHint
    EveryHintHandled
    DebtClearedOnlyAfterACoveringPass
