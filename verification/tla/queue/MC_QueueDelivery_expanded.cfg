\* TLA-QD baseline (expanded): 3 offsets over two range rows of 2, 2 attempts, 1 free release, unlease limit 2, clock 0..2, retention 1, failure retention 1; no unreadable body and no crash (the small and ranges configs carry them).
CONSTANTS
    N = 3
    RangeSize = 2
    MaxAttempts = 2
    FreeReleases = 1
    UnleaseLimit = 2
    MaxClock = 2
    Retention = 1
    FailRetention = 1
    LeaseTime = 1
    MaxUnreadable = 0
    MaxCrashes = 0
SPECIFICATION Spec
CONSTRAINT LeaseBound
INVARIANT
    TypeOK
    NoMessageLost
    NoSendAtOrBelowFrontier
    ReplayedSettleChangesNothing
    NothingOutlivesHardExpiry
    FrontierNeverPassesALiveImmediate
    CancelledNeverLeased
    UnleaseKeepsBudgets
    AccountingExact
    RangeRowsMatch
    PoisonBounded
    TickEnabled
