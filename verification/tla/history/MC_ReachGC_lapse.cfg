\* TLA-019 baseline (timing lapse): as small, but the compactor checkpoint lives 1 tick, less than the view's staleness plus a read. It stands for the case the timing assumption excludes (repeated failed manifest polls, or a read outlasting the checkpoint). A read can then need a deleted SST; it must fail, never complete short. Checks every safety property except the reader clause.
CONSTANTS
    MinAge = 1
    Horizon = 2
    MaxTime = 4
    CkLife = 1
    PollInterval = 1
    ReadSpan = 1
    UseCheckpoint = FALSE
    AllowOrphan = TRUE
    AllowReader = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    ManifestRefsPresent
    HistoryBacked
    CheckpointPinned
    NoFalseCompleteRead
