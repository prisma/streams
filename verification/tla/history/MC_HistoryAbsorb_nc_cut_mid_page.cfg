\* TLA-016 negative control (layout 5 pages): the per-stream cap stops a gather after the record that reaches it, inside its page. Expect BoundaryOnPageEdge violated.
CONSTANTS
    N = 3
    InitNext = 2
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 1
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT PageEnd <- MCPageEnd
CONSTANT ReadStopsAt <- MutStopMidPage
SPECIFICATION Spec
INVARIANT
    BoundaryOnPageEdge
