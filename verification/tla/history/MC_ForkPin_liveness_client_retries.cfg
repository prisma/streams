\* TLA-019 fork-pin liveness under the F8 premise: WF on each child's in-process request steps and on the CLIENT re-issuing DELETE; one request crash that then ceases; no fairness on deletes, forks, recreation or success outcomes; no symmetry.
CONSTANTS
    Children <- MCChildren
    MaxEpoch = 2
    MaxCrashes = 1
SPECIFICATION LiveSpecClientRetries
PROPERTY
    RefEventuallyReleased
    SoftSourceEventuallyTombstoned
