\* TLA-018 negative control (pre-fix layout 5 tiling): with a durable history page lost after the advance and no tiling check, the unfiltered history scan skips the lost page and reports completion. Expect ExactDurablePrefix violated.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = TRUE
    AllowReadError = TRUE
CONSTANT PageEnd <- MCPageEnd
CONSTANT TilingCheck <- MutNoTilingCheck
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
