\* TLA-018 baseline (expanded): APPLIED visibility, keyed read (K1), 1 record durable at Init and 2 appends during reads (the applied-only suffix can be lost on the ownership move and re-appended with new content), corrupt/short postings, one ownership move, provisional continuations verified or resynced across the move, 5 pages. history read errors off (see README).
CONSTANTS
    N = 3
    InitNext = 1
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 5
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
    ContinuationFits
