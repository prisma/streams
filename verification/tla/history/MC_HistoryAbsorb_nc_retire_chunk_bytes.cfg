\* TLA-016 negative control (pre-fix TLA-016-F1, small ledger shape): the committer retires the chunk's byte count whatever range it advances over. Expect LedgerExact violated (under-retirement after a refused group).
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT RetireBytes <- MutRetireChunkBytes
SPECIFICATION Spec
INVARIANT
    LedgerExact
