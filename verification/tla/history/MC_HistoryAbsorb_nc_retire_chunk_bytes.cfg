\* TLA-016 negative control (pre-fix TLA-016-F1, small ledger shape; slate's planted "retire ignoring from"): every advancing op retires its chunk's byte count from the boundary. Expect LedgerExact violated (under-retirement after a refused group).
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT Retires <- MutRetireIgnoringFrom
SPECIFICATION Spec
INVARIANT
    LedgerExact
