\* TLA-018 ASSUMPTION PROBE (not a production mutation): durable postings pages may disappear after the advance (violates ASM-SLATEDB-DURABLE/GC). Expect ExactDurablePrefix violated: the keyed reader cannot detect a lost page.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = TRUE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
