\* TLA-016 negative control (page shape): plan_read ignores replay_to, so a rolled-back mark re-gathers to the durable end. Expect NoStraddledChunk violated: the replay straddles the pages a failed flush left above the refused chunk.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 1
    MaxRejects = 2
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = TRUE
    ModelCache = FALSE
    Pages = TRUE
    Rescan = FALSE
    Prune = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT PlanUpto <- MutPlanUptoIgnoresReplay
SPECIFICATION Spec
INVARIANT
    NoStraddledChunk
