\* TLA-016 negative control (liveness-refusal shape; slate's planted "plan_reads rollback removed"): nothing rolls a stranded mark back. Expect AbsorptionCompletes violated: after a refusal every re-gather starts at the stranded mark and is Detached or finds no work.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT RollbackGate <- MutRollbackNever
SPECIFICATION LiveSpec
PROPERTY
    AbsorptionCompletes
