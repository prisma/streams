\* TLA-019 negative control (the model before the compactor checkpoint was added, small shape): the compactor commits without checkpointing the pre-compaction manifest. Expect LiveReadViewProtected violated: the collector deletes a compacted-away input that a read on the writer's stale view still references.
CONSTANTS
    MinAge = 1
    Horizon = 2
    MaxTime = 4
    CkLife = 3
    PollInterval = 1
    ReadSpan = 1
    UseCheckpoint = FALSE
    AllowOrphan = TRUE
    AllowReader = TRUE
CONSTANT CompactionCheckpoint <- MutNoCompactionCheckpoint
SPECIFICATION Spec
INVARIANT
    LiveReadViewProtected
