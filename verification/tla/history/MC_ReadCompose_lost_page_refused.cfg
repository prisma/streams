\* TLA-018 baseline (layout 5 pages, assumption probe AllowLostCanonical): a durable history page may disappear after the advance. The tiling check fails the read that meets it, so no lost record is ever passed off as consumed: ExactDurablePrefix, NoDuplicateDelivery and NoFabricatedRecord hold.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = TRUE
    AllowReadError = TRUE
CONSTANT PageEnd <- MCPageEnd
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
