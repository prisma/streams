\* TLA-016 liveness baseline with receipts: one refused group or dropped op (the rescan heals a dropped op), 1 applied-not-durable group and 1 queued batch, no crash, flush failure, prune or reader; bounded appends; fairness on actor attempts only (see LiveSpec).
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 1
    MaxChan = 1
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Rescan = TRUE
    Prune = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION LiveSpec
PROPERTY
    AbsorptionCompletes
