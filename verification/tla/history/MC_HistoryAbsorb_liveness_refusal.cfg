\* TLA-016 liveness baseline with a refusal: one refused group or dropped op, which strands the mark of a quiet stream until the fair dirty-index rescan re-pends it and the settled plan rolls the mark back; 2 applied-not-durable groups, 2 queued batches, the eviction prune, no crash, flush failure or reader; bounded appends.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION LiveSpec
PROPERTY
    AbsorptionCompletes
