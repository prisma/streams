\* TLA-016 ledger baseline with no lost publication: crashes, flush failures and refusals disabled, so only the ungated eviction prune can make a chunk start below the boundary (the over-retirement shape of TLA-016-F1).
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
