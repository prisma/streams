\* TLA-019 negative control: a marker is removed after an inconclusive release (in the request or by the reconciler). Expect RefEventuallyReleased violated: a creator's late install then pins the source with no marker left.
CONSTANTS
    Children <- MCChildren2
    Prev <- MCPrev2
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = FALSE
CONSTANT SettleMarker <- MutSettleAlways
SPECIFICATION LiveSpecReconciler
PROPERTY
    RefEventuallyReleased
