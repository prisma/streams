\* TLA-019 negative control (pre-fix recreation, legacy shape with a recreated child name): the recreate CAS overwrites a debt-bearing tombstone without indexing its debt. Expect OwedRefIndexed violated: after the rollout, the debt of a tombstone the backfill had not reached is lost.
CONSTANTS
    Children <- MCChildrenR
    Prev <- MCPrevR
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = TRUE
CONSTANT IndexOverwritten <- MutNoIndexOverwritten
SPECIFICATION Spec
INVARIANT
    OwedRefIndexed
