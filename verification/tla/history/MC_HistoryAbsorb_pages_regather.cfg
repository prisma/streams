\* TLA-016 baseline (page shape with stale re-gathers): 3 records, cap 2 records, ring or Remote-scan gathers, the eviction prune, 1 crash (a new owner) and 1 refused group, each of which can re-gather over pages an earlier chunk wrote; no flush failure or reader. Checks PagesAdmit (keep_past, d16559b3) with every ledger and history property.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 0
    MaxRejects = 1
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = TRUE
    ModelCache = FALSE
    Pages = TRUE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
    PagesAdmit
PROPERTY
    FrontiersMonotone
