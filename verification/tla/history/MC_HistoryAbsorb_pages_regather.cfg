\* TLA-016 baseline (page shape with stale re-gathers): 3 records, cap 2 records, ring or Remote-scan gathers, the dirty-index rescan, the eviction prune and 1 crash (a new owner), each of which re-gathers from a stale boundary and leaves overlapping pages; no flush failure, refusal or reader. Checks PagesAdmit (the reader admits every key's pages, overlapping ones included, d16559b3) with every ledger and history property.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = TRUE
    ModelCache = FALSE
    Pages = TRUE
    Rescan = TRUE
    Prune = TRUE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    MarkBackedByHistory
    LedgerExact
    NoMissingRetiredRow
    SettledMarkAtBoundary
    PagesAdmit
PROPERTY
    FrontiersMonotone
