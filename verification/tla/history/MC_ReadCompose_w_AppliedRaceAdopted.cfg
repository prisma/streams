\* TLA-018 reachability witness on the UNMODIFIED applied keyed model: expect Witness_AppliedRaceAdopted violated (an applied read adopts an absorbed boundary that is not yet Remote-durable and re-serves the trimmed prefix from history).
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
SPECIFICATION Spec
INVARIANT
    Witness_AppliedRaceAdopted
