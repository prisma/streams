\* TLA-016 baseline (small): 3 offsets, 1 durable at Init + 2 appends, per-stream cap 2 records, Remote-scan gathers, 2 applied-not-durable groups, 2 in-flight AbsorbedBatch messages, dirty-index rescan, eviction prune, 1 crash, 1 failed/ambiguous history flush, 1 refused operation, 1 reader.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    StaleReaderRangeIntact
    MarkBackedByHistory
PROPERTY
    FrontiersMonotone
