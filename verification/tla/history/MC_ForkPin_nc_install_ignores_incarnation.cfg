\* TLA-019 negative control (incarnation reuse): anchor::install is not fenced to the forked incarnation. Expect ForkPinRespected violated.
CONSTANTS
    Children <- MCChildren
    Prev <- MCPrev
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = FALSE
CONSTANT InstallFence <- MutInstallIgnoresIncarnation
SPECIFICATION Spec
INVARIANT
    ForkPinRespected
