\* TLA-016 baseline (cache shape, cap 2 records): as cache, but a gather stages up to two rows, so an install names a multi-row range.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = TRUE
    ModelCache = TRUE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 1
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
    CacheNeverProvesFalseAbsence
PROPERTY
    FrontiersMonotone
