\* TLA-018 baseline (expanded): APPLIED visibility, unfiltered replay, 2 appends during reads (the applied-only suffix is lost on the ownership move and re-appended with new content), reconnect from the durable cursor, 5 pages. Every property except ExactDurablePrefix, which the open defect TLA-018-F3 violates in this shape (known-defect check kd_stale_applied_cursor).
CONSTANTS
    N = 3
    InitNext = 1
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 5
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
