\* TLA-018 baseline (expanded): APPLIED visibility, unfiltered replay, 2 appends during reads (the applied-only suffix can be lost on the ownership move and re-appended with new content), reconnect from the durable cursor, provisional continuations verified or resynced across the move, 5 pages. Every property, ExactDurablePrefix included: the former known-defect shape of TLA-018-F3, fixed by the provisional continuation (KIND_KEY_V3).
CONSTANTS
    N = 3
    InitNext = 1
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 5
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
    ContinuationFits
