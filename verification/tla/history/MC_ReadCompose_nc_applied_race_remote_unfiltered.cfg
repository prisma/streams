\* TLA-018 negative control (pre-fix TLA-018-F1, applied unfiltered small shape): absorption_race reads the Remote-durable absorbed boundary for an applied Memory-level scan. Expect TailGapExplained violated: the page ends as an honest partial with no progress, less than a durable reader gets.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
CONSTANT RaceBoundary <- MutRaceBoundaryRemote
SPECIFICATION Spec
INVARIANT
    TailGapExplained
