\* TLA-018 negative control (pre-fix TLA-018-F3, applied unfiltered expanded shape): the entry span checks neither a continuation's writer history and digest nor a V2 position's durability; only `start > end` guards it. Expect ExactDurablePrefix violated: a continuation over an applied suffix the ownership move lost is accepted once the new owner's tail passes it.
CONSTANTS
    N = 3
    InitNext = 1
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 5
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = FALSE
CONSTANT ContinuationCheck <- MutNoContinuationCheck
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
