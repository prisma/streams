\* TLA-016 negative control (pre-fix TLA-016-F1, liveness shape): every advancing op retires its chunk's byte count. Expect AbsorptionCompletes violated: after an over-retirement every later advance is refused as an accounting divergence.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT Retires <- MutRetireIgnoringFrom
SPECIFICATION LiveSpec
PROPERTY
    AbsorptionCompletes
