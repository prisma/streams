\* TLA-016 negative control (pre-fix TLA-016-F3, cache shape; slate's gather): the warm install claims coverage from plan.from, whatever the scan returned. Expect CacheNeverProvesFalseAbsence violated: a stale re-plan over a trimmed head gives an evicted key a slice that proves a durable record absent.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 1
    GatherRing = TRUE
    ModelCache = TRUE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 1
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT WarmInstallFrom <- MutWarmInstallFromPlan
SPECIFICATION Spec
INVARIANT
    CacheNeverProvesFalseAbsence
