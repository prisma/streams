\* TLA-016 baseline (cache shape): the postings warm-install cache (install_chunk claims, one weight eviction, cold loads) with ring or Remote-scan gathers, cap 1 record and the eviction prune; no crash, flush failure, refusal or reader. Checks CacheNeverProvesFalseAbsence (TLA-016-F3, fixed) and every other safety property.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 1
    GatherRing = TRUE
    ModelCache = TRUE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 1
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
    CacheNeverProvesFalseAbsence
PROPERTY
    FrontiersMonotone
