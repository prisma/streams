\* TLA-019 fork-pin liveness with the background reconciler (TLA-019-F4 fix), recreated child name: WF on each child's in-process request steps and on the reconciler (each marker's settle step); NO client ever repeats DELETE; 2 child incarnations of one name (F3 recreates F1's name after F1's tombstone), so a debt can survive only as a marker, one request crash that then ceases; no fairness on deletes, forks, recreation or success outcomes; no symmetry.
CONSTANTS
    Children <- MCChildrenR
    Prev <- MCPrevR
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = FALSE
SPECIFICATION LiveSpecReconciler
PROPERTY
    RefEventuallyReleased
    SoftSourceEventuallyTombstoned
