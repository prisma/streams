\* TLA-018 negative control (pre-fix TLA-018-F1, applied keyed small shape): absorption_race reads the Remote-durable absorbed boundary for an applied Memory-level scan. Expect ExactDurablePrefix violated: a durable record trimmed by an applied, not yet durable advance is skipped.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
CONSTANT RaceBoundary <- MutRaceBoundaryRemote
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
