\* TLA-016 baseline (layout 5 pages): the small shape with records 0 and 1 in one stored page and record 2 in another, 2 records durable at Init (a page edge) and a per-stream cap of 1 record, so a gather that reaches its cap inside a page reads on to the page edge; trims delete a page only past its last record.
CONSTANTS
    N = 3
    InitNext = 2
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 1
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT PageEnd <- MCPageEnd
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    StaleReaderRangeIntact
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
    BoundaryOnPageEdge
PROPERTY
    FrontiersMonotone
