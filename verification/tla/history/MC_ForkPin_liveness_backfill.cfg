\* TLA-019 fork-pin liveness for pre-index debt: deletes before the rollout run the old binary (no markers); the rollout completes; the backfill and the reconciler are weakly fair; no client retries; 2 child incarnations under distinct names (see README for a recreated name).
CONSTANTS
    Children <- MCChildren2
    Prev <- MCPrev2
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = TRUE
SPECIFICATION LiveSpecReconciler
PROPERTY
    RefEventuallyReleased
    SoftSourceEventuallyTombstoned
