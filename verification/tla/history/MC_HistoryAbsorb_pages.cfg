\* TLA-016 baseline (page shape): 4 records, postings page ranges modelled; ring or Remote-scan gathers, cap 2 records, 1 failed/ambiguous flush and 2 refused groups, one of which may be a dropped op (refused chains overlap pages); no crash or prune. Checks PagesAdmit with every ledger and history property.
CONSTANTS
    N = 4
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 1
    MaxRejects = 2
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = TRUE
    ModelCache = FALSE
    Pages = TRUE
    Prune = FALSE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf4
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
    PagesAdmit
PROPERTY
    FrontiersMonotone
