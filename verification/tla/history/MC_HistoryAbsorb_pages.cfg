\* TLA-016 baseline (page shape): 4 records, postings page ranges modelled; ring or Remote-scan gathers, cap 2 records, 1 failed/ambiguous flush, 2 refused groups settled through their receipts; no crash, rescan or prune (each re-gathers from a stale boundary; see the w_StraddledPages* witnesses) and no dropped op (only the rescan heals one). Checks NoStraddledChunk (the replay_to cap) and PagesAdmit with every ledger and history property.
CONSTANTS
    N = 4
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 1
    MaxRejects = 2
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = TRUE
    ModelCache = FALSE
    Pages = TRUE
    Rescan = FALSE
    Prune = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf4
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    MarkBackedByHistory
    LedgerExact
    NoMissingRetiredRow
    SettledMarkAtBoundary
    NoStraddledChunk
    PagesAdmit
PROPERTY
    FrontiersMonotone
