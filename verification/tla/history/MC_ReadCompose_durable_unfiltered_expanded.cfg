\* TLA-018 baseline (expanded: 1 record durable at Init, 2 appends during reads, 5 pages): durable visibility, unfiltered replay, ring, one ownership move. history read errors off (see README).
CONSTANTS
    N = 3
    InitNext = 1
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 5
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
