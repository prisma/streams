\* TLA-016 reachability witness on the UNMODIFIED model with a bucket mate: expect Witness_MateDelaysRollback violated (a plan keeps a stranded mark only because a bucket-sharing stream has an advance in flight, and absorption still completes).
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = TRUE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    Witness_MateDelaysRollback
