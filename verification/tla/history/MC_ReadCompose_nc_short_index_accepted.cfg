\* TLA-018 negative control: a postings window proving less than the requested range is treated as complete (missing postings become an empty success). Expect ExactDurablePrefix violated.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
CONSTANT ShortIndexAccepted <- MutShortIndexAccepted
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
