\* TLA-016 negative control (pre-fix TLA-016-F1, overlap shape with no lost publication): the committer retires the chunk's byte count. Expect LedgerExact violated (over-retirement by a stale re-plan).
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Rescan = TRUE
    Prune = TRUE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT RetireBytes <- MutRetireChunkBytes
SPECIFICATION Spec
INVARIANT
    LedgerExact
