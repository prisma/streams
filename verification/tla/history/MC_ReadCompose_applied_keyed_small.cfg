\* TLA-018 baseline (small): APPLIED visibility, keyed read (K1), two keys, large first record, corrupt/short postings, one ownership move, history read errors. The TLA-018-F1 shape: two applied, not yet durable advances trim below the reader.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
