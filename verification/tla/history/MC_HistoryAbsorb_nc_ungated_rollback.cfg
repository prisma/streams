\* TLA-016 negative control (slate's planted control for b5751e75, no faults): the plan rolls a mark above the published boundary back whether or not the stream's bucket is settled. Expect DetachedOnlyAfterFault violated: the re-gather starts under the queued advance, which lands first, and the committer drops the re-gather as Detached.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT RollbackGate <- MutRollbackUngated
SPECIFICATION Spec
INVARIANT
    DetachedOnlyAfterFault
