\* TLA-018 negative control: the history leg reads a history view captured at page start while absorption_race adopts a newer boundary. Expect ExactDurablePrefix violated.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
CONSTANT HistView <- MutHistViewAtPageStart
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
