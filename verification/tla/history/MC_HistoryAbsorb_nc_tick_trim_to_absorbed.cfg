\* TLA-016 negative control: the TrimTick trims toward the current absorbed boundary, dropping the one-advance lag. Expect StaleReaderRangeIntact violated.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Rescan = TRUE
    Prune = TRUE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT TickTrimTarget <- MutTickTrimToAbsorbed
SPECIFICATION Spec
INVARIANT
    StaleReaderRangeIntact
