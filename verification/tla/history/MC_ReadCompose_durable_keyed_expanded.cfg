\* TLA-018 baseline (expanded: 1 record durable at Init, 2 appends during reads, 5 pages): durable visibility, keyed read (K1), corrupt/short postings, ring, one ownership move. history read errors off (a page error only ends the page; see README).
CONSTANTS
    N = 3
    InitNext = 1
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 5
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
    ContinuationFits
