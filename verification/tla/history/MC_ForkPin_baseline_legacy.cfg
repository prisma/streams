\* TLA-019 fork-pin baseline, legacy shape: deletes before the rollout run the pre-index binary (no markers), then the one-time backfill; 3 fork-child incarnations (F3 recreates F1's name, before or after the rollout), one source name with 2 incarnations, one request crash. OwedRefIndexed: after the rollout no recreation overwrites a debt the reconciler cannot find.
CONSTANTS
    Children <- MCChildren
    Prev <- MCPrev
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    ForkPinRespected
    ReadyHoldsRef
    OwedRefIndexed
