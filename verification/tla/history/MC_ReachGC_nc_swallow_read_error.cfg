\* TLA-019 (timing-lapse shape: compactor checkpoint of 1 tick) REPOSITORY negative control: the history read path turns a deleted-SST read error into a completed empty result. Expect NoFalseCompleteRead violated.
CONSTANTS
    MinAge = 1
    Horizon = 2
    MaxTime = 4
    CkLife = 1
    PollInterval = 1
    ReadSpan = 1
    UseCheckpoint = FALSE
    AllowOrphan = TRUE
    AllowReader = TRUE
CONSTANT RepoOnDeletedRead <- MutRepoSwallowReadError
SPECIFICATION Spec
INVARIANT
    NoFalseCompleteRead
