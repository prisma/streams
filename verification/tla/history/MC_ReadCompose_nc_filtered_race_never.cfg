\* TLA-018 negative control: a filtered tail scan is accepted without consulting durable_absorbed (advance past an unreturned eligible record). Expect ExactDurablePrefix violated.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "K1"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = TRUE
    AllowShortIndex = TRUE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
CONSTANT FilteredRace <- MutFilteredRaceNever
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
