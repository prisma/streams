\* TLA-016 baseline (recount shape): 4 records, cap 1 record, 1 applied-not-durable group, 2 queued batches, 2 refused groups or 1 refused group and 1 dropped op, rescan (no prune), no crash, flush failure or reader. Checks SettledMarkAtBoundary (a refused chunk is replayed from the boundary) with the ledger properties.
CONSTANTS
    N = 4
    InitNext = 1
    MaxPend = 1
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 2
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 1
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Rescan = TRUE
    Prune = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf4
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    MarkBackedByHistory
    LedgerExact
    NoMissingRetiredRow
    SettledMarkAtBoundary
