CONSTANTS
    MinAge = 2
    Horizon = 2
    MaxTime = 5
    CkLife = 3
    PollInterval = 1
    ReadSpan = 1
    UseCheckpoint = TRUE
    AllowOrphan = TRUE
    AllowReader = TRUE
