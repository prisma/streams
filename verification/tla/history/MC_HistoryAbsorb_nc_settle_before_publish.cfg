\* TLA-016 negative control (no faults): a group's receipts settle once it is remote-durable, before dispatch publishes its tails. Expect NoRegatherUnderInFlight violated: the plan sees the bucket settled while the published boundary still lags the durable one, and re-gathers below it.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT HeldPastWal <- MutSettleAtWal
SPECIFICATION Spec
INVARIANT
    NoRegatherUnderInFlight
