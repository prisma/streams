\* TLA-016 reachability witness on the UNMODIFIED model (overlapping pages, admitted since d16559b3): expect Witness_OverlapAdmitted violated. A restart or ownership move loses the advances of two flushed chunks, and the new owner's re-gather from the durable boundary writes a page over the second chunk's; the index admits and absorption completes. No refusal, flush failure, rescan or prune.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = TRUE
    Rescan = FALSE
    Prune = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    Witness_OverlapAdmitted
