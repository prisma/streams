\* TLA-018 ASSUMPTION PROBE (not a production mutation): durable canonical rows may disappear after the advance. Expect ExactDurablePrefix violated: the unfiltered history scan skips a missing row and reports completion.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "durable"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = TRUE
    AllowReadError = TRUE
SPECIFICATION Spec
INVARIANT
    ExactDurablePrefix
