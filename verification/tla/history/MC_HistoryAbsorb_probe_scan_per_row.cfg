\* TLA-016 probe (dependency contract ASM-SLATEDB-DURABLE (j)): the Remote scan observes the trim point row by row instead of one snapshot, every record under one key, 3 queued batches. Expect PagesAdmit violated: after the ungated prune a stale re-gather reads row 0, the three queued advances land and trim row 1, and the chunk {0, 2} writes a page that disagrees with the page of row 1, so the reader refuses the key's index.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 3
    MaxCrashes = 0
    MaxFlushFail = 0
    MaxRejects = 0
    MaxDrops = 0
    TrimBudgets = {0, 1, 3}
    MaxReads = 0
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = TRUE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOfOne
CONSTANT ScanView <- MutScanPerRow
SPECIFICATION Spec
INVARIANT
    PagesAdmit
