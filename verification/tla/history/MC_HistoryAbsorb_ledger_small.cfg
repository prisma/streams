\* TLA-016 ledger baseline (small shape): the exact per-stream unabsorbed_bytes ledger, with a crash, a failed flush and a refused group (the lost-advance under-retirement shape of TLA-016-F1), and no retired row ever missing.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    LedgerExact
    NoMissingRetiredRow
