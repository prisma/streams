\* TLA-016 ledger baseline with a bucket mate: the small shape (crash, failed flush, refused group or dropped op) plus another stream sharing the settlement bucket, whose in-flight advances can hold the rollback gate closed. Checks the exact ledger, the gate and Detached-only-after-fault.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = TRUE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
