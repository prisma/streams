\* TLA-019 fork-pin liveness for pre-index debt with a recreated child name: deletes before the rollout write no marker; F3 recreates F1's name, possibly before the backfill reaches F1's tombstone; the rollout completes; the backfill and the reconciler are weakly fair; no client retries. The properties exclude a debt the old binary overwrote before the rollout (lostOld).
CONSTANTS
    Children <- MCChildrenR
    Prev <- MCPrevR
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = TRUE
SPECIFICATION LiveSpecReconciler
PROPERTY
    RefEventuallyReleased
    SoftSourceEventuallyTombstoned
