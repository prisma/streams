\* TLA-019 negative control: for a recreated child name, the reconciler releases the fork id of the incarnation that now holds the name. Expect ReadyHoldsRef violated.
CONSTANTS
    Children <- MCChildren
    Prev <- MCPrev
    MaxEpoch = 2
    MaxCrashes = 1
    Legacy = FALSE
CONSTANT ReleaseId <- MutReleaseCurrentNameId
SPECIFICATION Spec
INVARIANT
    ReadyHoldsRef
