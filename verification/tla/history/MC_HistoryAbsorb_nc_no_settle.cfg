\* TLA-016 negative control (pre-fix receipts, small shape): settling never rolls a mark back, as before the absorber learned of refused groups. Expect SettledMarkAtBoundary violated: a refused chunk leaves the mark above the boundary.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 2
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 1
    Cap = 2
    GatherRing = FALSE
    ModelCache = FALSE
    Pages = FALSE
    Rescan = TRUE
    Prune = TRUE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
CONSTANT SettleRollsBack <- MutSettleNeverRollsBack
SPECIFICATION Spec
INVARIANT
    SettledMarkAtBoundary
