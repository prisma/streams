\* TLA-018 baseline (layout 5 pages): applied visibility, unfiltered replay, records 0 and 1 in one stored page and record 2 in another, so a page cut after the large first record resumes inside a page; trims delete a page only past its last record; ring, one ownership move, history read errors.
CONSTANTS
    N = 3
    InitNext = 3
    KeyOf <- MCKeyOf
    Size <- MCSize
    Req = 2
    Filter = "none"
    Mode = "applied"
    MaxPend = 2
    MaxMoves = 1
    MaxPages = 4
    MaxLoops = 2
    TrimBudgets = {0, 1, 3}
    AllowRing = TRUE
    AllowCorrupt = FALSE
    AllowShortIndex = FALSE
    AllowLostPostings = FALSE
    AllowLostCanonical = FALSE
    AllowReadError = TRUE
CONSTANT PageEnd <- MCPageEnd
SPECIFICATION Spec
INVARIANT
    TypeOK
    HistoryCoversBoundary
    ExactDurablePrefix
    NoDuplicateDelivery
    NoFabricatedRecord
    PageCeiling
    TailGapExplained
    ContinuationFits
