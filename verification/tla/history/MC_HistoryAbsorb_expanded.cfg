\* TLA-016 baseline (expanded): as small but gathers may also be served by the durable tail ring (a chunk can then start below the trim point), per-stream cap 1 record, 3 applied-not-durable groups and 2 reader snapshots.
CONSTANTS
    N = 3
    InitNext = 1
    MaxPend = 3
    MaxChan = 2
    MaxCrashes = 1
    MaxFlushFail = 1
    MaxRejects = 1
    MaxDrops = 1
    TrimBudgets = {0, 1, 3}
    MaxReads = 2
    Cap = 1
    GatherRing = TRUE
    ModelCache = FALSE
    Pages = FALSE
    Prune = TRUE
    BucketMate = FALSE
    MaxEvict = 0
    Keys <- MCKeys
    KeyOf <- MCKeyOf
SPECIFICATION Spec
INVARIANT
    TypeOK
    StoredTailValid
    H3_AbsorbedBackedByDurableHistory
    LastRecoverableCopy
    H4_TrimWithinPreviousBoundary
    StaleReaderRangeIntact
    MarkBackedByHistory
    LedgerExact
    NoRegatherUnderInFlight
    DetachedOnlyAfterFault
PROPERTY
    FrontiersMonotone
