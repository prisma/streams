\* TLA-019 baseline (small, production posture: no user checkpoints): min_age 1 tick (300 s), writer active to tick 2, clock to 4, fenced-writer orphan, one production read through the writer's in-memory view; the compactor checkpoints the pre-compaction manifest for 3 ticks (900 s), the view is refreshed within 1 tick (300 s) of going stale and a read ends within 1 tick. Every safety property, the reader clause included.
CONSTANTS
    MinAge = 1
    Horizon = 2
    MaxTime = 4
    CkLife = 3
    PollInterval = 1
    ReadSpan = 1
    UseCheckpoint = FALSE
    AllowOrphan = TRUE
    AllowReader = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    ManifestRefsPresent
    HistoryBacked
    CheckpointPinned
    NoFalseCompleteRead
    LiveReadViewProtected
