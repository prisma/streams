\* TLA-045 baseline (the split arm): one leaf split into its halves by an actor that may crash once, another instance that may open the parent at any point, a lease that lapses whatever the actor does, two attempts. Every safety property.
CONSTANTS
    Insts = {"a", "b"}
    Actor = "a"
    MaxEpoch = 6
    MaxHomes = 2
    PublishNeedsT = TRUE
    RollBackNeedsNoT = TRUE
    BarrierBeforeCkpt = TRUE
    FreshHome = TRUE
    ClaimAfterFence = TRUE
    ClaimOpens = TRUE
    ForwardFromT = TRUE
    ActorStaysFenced = TRUE
    HeldUnderT = TRUE
    FenceAtOpen = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    AckedReadable
    NoDualServe
    RetiredNeverServes
    ChildrenExact
    HomesUnique
    NoTEndedUnpublished
