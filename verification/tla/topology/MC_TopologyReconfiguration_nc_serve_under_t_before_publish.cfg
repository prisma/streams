\* TLA-045 negative control: the fence serves an open whose log holds T before the topology retires it. Expect RetiredNeverServes violated.
CONSTANTS
    Insts = {"a", "b"}
    Actor = "a"
    MaxEpoch = 6
    MaxHomes = 2
    PublishNeedsT = TRUE
    RollBackNeedsNoT = TRUE
    BarrierBeforeCkpt = TRUE
    FreshHome = TRUE
    ClaimAfterFence = TRUE
    ClaimOpens = TRUE
    ForwardFromT = TRUE
    ActorStaysFenced = TRUE
    HeldUnderT = FALSE
    FenceAtOpen = TRUE
SPECIFICATION Spec
INVARIANT
    RetiredNeverServes
