\* TLA-048 liveness, a local pair on an instance at its ceiling (#251 R5): "a" holds both halves and one other shard at Cap 3, no spare to ask for, and the merge still starts, ends, and publishes. Requests reach the sources (RequestsFair), so both are open on "a": the model's Begin needs both engines current, where the code's merge entry opens them itself.
CONSTANTS
    Insts = {"a", "b"}
    InitAlive = {"a", "b"}
    Spare = "a"
    Ring0 = "a"
    Ring1 = "a"
    LoadA = 1
    LoadB = 0
    Cap = 3
    MaxAtt = 1
    MaxCrashes = 0
    MaxParts = 0
    MaxLapses = 1
    BoundLapses = TRUE
    MaxRestarts = 1
    BoundRestarts = TRUE
    FirstOpenUnheld = TRUE
    RequestsFair = TRUE
    ClaimRaceFair = FALSE
    PartnerFallback = TRUE
    AskWhenNoRoom = FALSE
    ClaimFencesBoth = TRUE
    RollBackNeedsNoT = TRUE
    ReclaimNeedsPublish = TRUE
    BarrierBeforeCkpt = TRUE
    CloneBoth = TRUE
    HeldUnderT = TRUE
    EagerMoveIn = TRUE
    LapsedOpen = TRUE
    HoldBeforeOpen = TRUE
    MaintOpenHolds = TRUE
    MaintExemptOwn = TRUE
    ClaimBeforeMaint = TRUE
    HeartbeatReclaim = TRUE
SPECIFICATION LiveSpec
PROPERTY
    MergeHappens
    OperationCompletes
