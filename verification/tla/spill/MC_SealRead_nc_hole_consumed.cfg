\* TLA-018 negative control: late directory AND a missing chunk treated as consumed. Expect NoSkip violated. Two substitutions on purpose: while step 5 precedes step 6 there is never a hole below the boundary, so HoleConsumed alone changes no behaviour and cannot fail; the late directory alone is masked for NoSkip by the honest partial (it breaks NoShortRead, nc-late-directory). Together they show the honest-partial rule is what keeps a hole from becoming a skip.
CONSTANTS
    N = 3
    Keys <- MCKeys
    KeyOf <- MCKeyOf
    Filter = "none"
    Mode = "applied"
    Window = 3
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 2
    MaxReads = 3
    AllowRing = TRUE
    FalsePositive = FALSE
    PublishEarly <- MutPublishLate
    HoleConsumed <- MutHoleConsumed
SPECIFICATION Spec
INVARIANT
    NoSkip
