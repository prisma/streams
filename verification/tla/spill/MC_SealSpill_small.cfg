\* TLA-016 baseline (small): one stream, 3 offsets, 2 seals, a seal group may carry an append of the sealed stream, 1 crash, 1 dropped seal group, 1 seal failure (PUT or 7a), 1 deadline flush.
CONSTANTS
    Streams = {s1}
    N = 3
    MaxCrashes = 1
    MaxSeals = 2
    MaxRejects = 1
    MaxAborts = 1
    MaxDeadlines = 1
    PairAppend = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    I1_AckedReadableAfterRestart
    I2_PendingRowTiles
    I3_DirectoryTiles
    MemoryMirrorsStore
    MemoryDirectoryCovers
    F2_SealFlushLeavesNoSealedPage
