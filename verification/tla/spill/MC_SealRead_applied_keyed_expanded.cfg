\* TLA-018 baseline (expanded): applied visibility, keyed reads (K1); 4 offsets (K1, K2, K1, K2), window 2, page budget 1-2, the unsealed pages captured with the boundary (F4), one-page chunks with false-positive summaries, 3 seals, 4 reads, the ring with eviction.
CONSTANTS
    N = 4
    Keys <- MCKeys
    KeyOf <- MCKeyOf4
    Filter = "K1"
    Mode = "applied"
    Window = 2
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 3
    MaxReads = 4
    AllowRing = TRUE
    FalsePositive = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    VisibleOnly
    NoSkip
    NoShortRead
    ExactDeliveredPrefix
    NoReadError
