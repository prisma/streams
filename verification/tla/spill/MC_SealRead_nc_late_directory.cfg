\* TLA-018 negative control: the chunks are published after the commit is durable. Expect NoShortRead violated.
CONSTANTS
    N = 3
    Keys <- MCKeys
    KeyOf <- MCKeyOf
    Filter = "none"
    Mode = "durable"
    Window = 3
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 2
    MaxReads = 3
    AllowRing = TRUE
    FalsePositive = FALSE
    PublishEarly <- MutPublishLate
SPECIFICATION Spec
INVARIANT
    NoShortRead
