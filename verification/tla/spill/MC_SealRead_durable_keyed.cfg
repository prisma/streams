\* TLA-018 baseline: durable visibility, keyed reads (K1); 3 offsets (K1, K2, K1), window 3, page budget 1-2, the unsealed pages captured with the boundary (F4), one-page chunks whose summaries may admit a key they lack, 2 seals, 3 reads, the ring with eviction.
CONSTANTS
    N = 3
    Keys <- MCKeys
    KeyOf <- MCKeyOf
    Filter = "K1"
    Mode = "durable"
    Window = 3
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 2
    MaxReads = 3
    AllowRing = TRUE
    FalsePositive = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    VisibleOnly
    NoSkip
    NoShortRead
    ExactDeliveredPrefix
    NoReadError
