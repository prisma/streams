\* TLA-016 baseline (two streams): 2 streams of 2 offsets sealed together (the all-or-nothing commit), 2 seals, 1 crash, 1 dropped seal group, 1 seal failure, 1 deadline flush.
CONSTANTS
    Streams = {s1, s2}
    N = 2
    MaxCrashes = 1
    MaxSeals = 2
    MaxRejects = 1
    MaxAborts = 1
    MaxDeadlines = 1
    PairAppend = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    I1_AckedReadableAfterRestart
    I2_PendingRowTiles
    I3_DirectoryTiles
    MemoryMirrorsStore
    MemoryDirectoryCovers
    F2_SealFlushLeavesNoSealedPage
