\* TLA-016 baseline (expanded): one stream, 4 offsets, 3 seals, 1 crash, 1 dropped seal group, 1 seal failure, 1 deadline flush.
CONSTANTS
    Streams = {s1}
    N = 4
    MaxCrashes = 1
    MaxSeals = 3
    MaxRejects = 1
    MaxAborts = 1
    MaxDeadlines = 1
    PairAppend = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    I1_AckedReadableAfterRestart
    I2_PendingRowTiles
    I3_DirectoryTiles
    MemoryMirrorsStore
    MemoryDirectoryCovers
    F2_SealFlushLeavesNoSealedPage
