\* TLA-016 negative control (S3a §4.1): the seal's remainder commit never deletes the 'W' row. Expect W_IndexMatchesPending violated.
CONSTANTS
    Streams = {s1}
    N = 3
    MaxCrashes = 1
    MaxSeals = 2
    MaxRejects = 1
    MaxAborts = 1
    MaxDeadlines = 1
    PairAppend = TRUE
CONSTANT RemainderIndexOp <- MutRemainderKeepsIndex
SPECIFICATION Spec
INVARIANT
    W_IndexMatchesPending
