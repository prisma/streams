\* TLA-018 negative control (pre-fix TLA-018-F4): the unsealed part reads the pending pages under a second lock acquisition. Expect NoReadError violated.
CONSTANTS
    N = 3
    Keys <- MCKeys
    KeyOf <- MCKeyOf
    Filter = "none"
    Mode = "applied"
    Window = 3
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 2
    MaxReads = 3
    AllowRing = TRUE
    FalsePositive = FALSE
    UnsealedSource <- MutSecondLock
SPECIFICATION Spec
INVARIANT
    NoReadError
