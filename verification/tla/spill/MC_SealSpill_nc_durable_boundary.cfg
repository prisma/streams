\* TLA-016 negative control (REVIEW-6A F2): a memtable flush retains at the durable seq (SlateDB before #2208). Expect F2_SealFlushLeavesNoSealedPage violated.
CONSTANTS
    Streams = {s1}
    N = 3
    MaxCrashes = 1
    MaxSeals = 2
    MaxRejects = 1
    MaxAborts = 1
    MaxDeadlines = 1
    PairAppend = TRUE
CONSTANT FlushBoundary <- MutDurableBoundary
SPECIFICATION Spec
INVARIANT
    F2_SealFlushLeavesNoSealedPage
