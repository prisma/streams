\* TLA-016 negative control (REVIEW-6A F1): the remainder is pre-built from the snapshot's pages. Expect I1_AckedReadableAfterRestart violated.
CONSTANTS
    Streams = {s1}
    N = 3
    MaxCrashes = 1
    MaxSeals = 2
    MaxRejects = 1
    MaxAborts = 1
    MaxDeadlines = 1
    PairAppend = TRUE
CONSTANT RemainderBase <- MutRemainderFromSnapshot
SPECIFICATION Spec
INVARIANT
    I1_AckedReadableAfterRestart
