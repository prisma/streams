\* TLA-018 negative control: a chunk's key summary omits the read's key. Expect NoSkip violated.
CONSTANTS
    N = 3
    Keys <- MCKeys
    KeyOf <- MCKeyOf
    Filter = "K1"
    Mode = "durable"
    Window = 3
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 2
    MaxReads = 3
    AllowRing = TRUE
    FalsePositive = FALSE
    Summary <- MutSummaryUnder
SPECIFICATION Spec
INVARIANT
    NoSkip
