\* TLA-018 reachability witness on the UNMODIFIED model: a seal commits between a read's R1 and its unsealed part (the TLA-018-F4 race) and the read succeeds from its capture. Expect Witness_UnsealedReadRacesSeal violated.
CONSTANTS
    N = 3
    Keys <- MCKeys
    KeyOf <- MCKeyOf
    Filter = "none"
    Mode = "applied"
    Window = 3
    MaxBudget = 2
    ChunkPages = 1
    MaxSeals = 2
    MaxReads = 3
    AllowRing = TRUE
    FalsePositive = FALSE
SPECIFICATION Spec
INVARIANT
    Witness_UnsealedReadRacesSeal
