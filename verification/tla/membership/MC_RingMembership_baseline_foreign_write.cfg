\* a foreign write drops a running member's boot id, a leaver beyond the count among them, no count change and no joiner: C18 restamps, C18b keeps its own ring, whatever the count
CONSTANTS
    Design = "record"
    RingRule = "evidence"
    CoverRule = "owners"
    DrainNoJoin = TRUE
    AnnounceAfterRemoval = TRUE
    CoverageGuard = TRUE
    ThirdPartyNoOp = FALSE
    NoOpCounted = TRUE
    RefreshKeepsRing = FALSE
    SealOnRelease = TRUE
    SlotOn = FALSE
    InitCount = 2
    InitUp = {"n1", "n2", "n3"}
    InitEntryQ = "none"
    MaxCountChanges = 0
    MaxMoves = 2
    MaxCrashes = 0
    MaxRestarts = 0
    MaxMisjudges = 0
    JoinFallbackOn = FALSE
    LeaveFallbackOn = FALSE
    DeadRemovalOn = FALSE
    DrainOn = FALSE
    MaxForeignWrites <- OneForeignWrite
SPECIFICATION Spec
ACTION_CONSTRAINT FlagStops
INVARIANT
    TypeOK
    MembershipMovesNothing
    NoTwoEngines
