    DrainNoJoin = TRUE
    AnnounceAfterRemoval = TRUE
    CoverageGuard = TRUE
    ThirdPartyNoOp = FALSE
    NoOpCounted = TRUE
    RefreshKeepsRing = FALSE
    SealOnRelease = TRUE
    SlotOn = FALSE
    InitCount = 2
    InitUp = {"n1", "n2", "n3"}
