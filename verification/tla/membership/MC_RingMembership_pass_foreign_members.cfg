\* a foreign write drops `members` with every member within the count: C17 relists today's ordinals, C18 restamps the others in place
CONSTANTS
    Design = "record"
    RingRule = "evidence"
    CoverRule = "owners"
    DrainNoJoin = TRUE
    AnnounceAfterRemoval = TRUE
    CoverageGuard = TRUE
    ThirdPartyNoOp = FALSE
    NoOpCounted = TRUE
    RefreshKeepsRing = FALSE
    SealOnRelease = TRUE
    SlotOn = FALSE
    InitCount = 2
    InitUp = {"n1", "n2"}
    InitEntryQ = "none"
    MaxCountChanges = 0
    MaxMoves = 1
    MaxCrashes = 0
    MaxRestarts = 0
    MaxMisjudges = 0
    JoinFallbackOn = FALSE
    LeaveFallbackOn = FALSE
    DeadRemovalOn = FALSE
    DrainOn = FALSE
    MaxForeignWrites <- OneForeignWrite
    ForeignWrite <- ForeignWriteMembers
SPECIFICATION Spec
ACTION_CONSTRAINT FlagStops
INVARIANT
    TypeOK
    MembershipMovesNothing
    NoTwoEngines
