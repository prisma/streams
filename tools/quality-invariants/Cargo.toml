[package]
name = "streams-quality-invariants"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# These imports live in the actual production modules included via #[path].
[package.metadata.cargo-machete]
ignored = ["aes-gcm", "aes-gcm-siv", "base64", "hkdf", "hmac", "serde", "sha2", "zstd", "bytes", "tokio", "futures-util", "proptest"]

[dependencies]
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
base64 = "0.22.1"
hkdf = "0.12"
hmac = "0.12"
serde = "1"
sha2 = "0.10"
zstd = "0.13"
bytes = "1"
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"

[dev-dependencies]
proptest = "=1.11.0"

[lints]
workspace = true
