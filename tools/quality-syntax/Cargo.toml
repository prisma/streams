[package]
name = "streams-quality-syntax"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
