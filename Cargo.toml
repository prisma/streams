[package]
name = "streams-slate"
version = "0.2.0-preview.8"
edition = "2024"

[dependencies]
libc = "0.2"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
hdrhistogram = "7"
object_store = { version = "0.14.1", features = ["aws"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slatedb = { version = "0.15.0", features = ["zstd", "wal_disable"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
zstd = "0.13"
futures-core = "0.3.32"
futures-util = "0.3.32"
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22.1"
hmac = "0.12"
tokio-stream = "0.1.18"

[[bin]]
name = "streams-slate"
path = "src/main.rs"

[[bin]]
name = "s3lite"
path = "src/bin/s3lite.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
lto = "thin"

[[bin]]
name = "streams-keys"
path = "src/bin/keys.rs"

[[bin]]
name = "livebench"
path = "src/bin/livebench.rs"

[[bin]]
name = "edgesim"
path = "src/bin/edgesim.rs"

[[bin]]
name = "pilot"
path = "src/bin/pilot.rs"

[[bin]]
name = "cryptobench"
path = "src/bin/cryptobench.rs"



[patch.crates-io]
# UPSTREAM main, pinned by rev — the fork is retired (2026-08-05).
# Contains everything we carried: #1964 yield points (merged), #1993
# 10-minute default GC interval (upstream chose this over our #1991
# adaptive backoff), #1968 probe-cached latest reads, #1894 concurrent
# GC deletes. Our GC listing-reuse/inventory patches are dropped in
# favor of tuned static intervals (see main.rs GC block + the A/B in
# docs/COST-CAMPAIGN-2.md addendum). Move to a crates.io version when
# a release after v0.15.0 ships. Fork history preserved at
# sorenbs/slatedb (tags pin-014-final, and the final pin rev 323bc1b).
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "0717cc1e4e9bad10a4773760f66bac4264ecf05e" }
