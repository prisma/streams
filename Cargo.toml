[package]
name = "streams-slate"
version = "0.2.0-rc.4"
edition = "2024"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
anyhow = "1"
axum = "0.8"
# #269: direct h1 connection serving with a bounded read/write buffer
# (axum::serve's defaults cost ~53 KB per parked SSE connection).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
hdrhistogram = "7"
object_store = { version = "0.14.1", features = ["aws"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slatedb = { version = "0.15.0", features = ["zstd", "wal_disable"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
zstd = "0.13"
futures-core = "0.3.32"
futures-util = "0.3.32"
aes-gcm = "0.10"
# RFC 8452 misuse resistance for rollback/re-encryption at a reused offset.
aes-gcm-siv = "0.11"
hkdf = "0.12"
base64 = "0.22.1"
hmac = "0.12"
# MT Stage 2b (docs/MULTITENANCY.md §7): JWT verification for the
# per-project access-token principal. jsonwebtoken is the audited
# standard (alg allowlisting, aud/iss/exp validation, JWK decoding) —
# hand-rolled JWT parsing is the classic alg-confusion trap. arc-swap
# provides the lock-free policy/JWKS snapshot swap the request path
# reads (no request performs a synchronous Control Plane lookup).
jsonwebtoken = "9"
arc-swap = "1"

[dev-dependencies]
proptest = "=1.11.0"
loom = "=0.7.2"
# SR-6 identity lint (src/mt_lint.rs): parses the crate's own sources
# and enforces ZERO unmarked residuals for the multitenancy security
# categories. Test-only — never linked into the server binary.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

[[bin]]
name = "streams-slate"
path = "src/main.rs"

[[bin]]
name = "s3lite"
path = "src/bin/s3lite.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
lto = "thin"

# Mutation tests run real assertions with optimization but without release LTO
# or debug-symbol overhead. This profile never changes the shipped binary.
[profile.quality]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[[bin]]
name = "streams-keys"
path = "src/bin/keys.rs"

[[bin]]
name = "livebench"
path = "src/bin/livebench.rs"

[[bin]]
name = "edgesim"
path = "src/bin/edgesim.rs"

[[bin]]
name = "pilot"
path = "src/bin/pilot.rs"

[[bin]]
name = "cryptobench"
path = "src/bin/cryptobench.rs"

[patch.crates-io]
# UPSTREAM main, pinned by rev — the fork is retired (2026-08-05).
# Contains everything we carried: #1964 yield points (merged), #1993
# 10-minute default GC interval (upstream chose this over our #1991
# adaptive backoff), #1968 probe-cached latest reads, #1894 concurrent
# GC deletes. Our GC listing-reuse/inventory patches are dropped in
# favor of tuned static intervals (see main.rs GC block + the A/B in
# docs/COST-CAMPAIGN-2.md addendum). Move to a crates.io version when
# a release after v0.15.0 ships. Fork history preserved at
# sorenbs/slatedb (tags pin-014-final, and the final pin rev 323bc1b).
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "0717cc1e4e9bad10a4773760f66bac4264ecf05e" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }

# Structure and explicit contracts
excessive_nesting = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
option_option = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"

# Ownership and hidden failure
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

# Suspicious conversions and avoidable ownership work
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"

# Enforce the canonical effect boundaries below
disallowed_methods = "warn"
allow_attributes_without_reason = "warn"

[workspace]
members = ["tools/quality-syntax", "tools/quality-invariants", "fuzz"]
resolver = "3"

[lints]
workspace = true
