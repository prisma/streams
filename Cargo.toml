[package]
name = "streams-slate"
version = "0.3.0-beta.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
anyhow = "1"
axum = "0.8"
# #269: direct h1 connection serving with a bounded read/write buffer
# (axum::serve's defaults cost ~53 KB per parked SSE connection).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
hdrhistogram = "7"
object_store = { version = "0.14.1", features = ["aws"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: every server-side parse of a record (watch keys, the
# record validator's range check) is correctly rounded, as JavaScript's is.
# raw_value: JSON records are stored and served as the client's own text.
# Never arbitrary_precision: it breaks the billing envelope's flatten decode.
# creation::json_record_tests pins all three.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
slatedb = { version = "0.17.0", features = ["zstd", "wal_disable"] }
# SlateDB's metrics recorder and its trait, which slatedb does not
# re-export (the sealer reads the memtable's write counters, layout 6): the
# crate slatedb already builds, patched to the same rev below.
slatedb-common = "0.17.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
zstd = "0.14.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
aes-gcm = "0.10"
# RFC 8452 misuse resistance for rollback/re-encryption at a reused offset.
aes-gcm-siv = "0.11"
hkdf = "0.12"
base64 = "0.22.1"
hmac = "0.12"
# MT Stage 2b (docs/MULTITENANCY.md §7): JWT verification for the
# per-project access-token principal. jsonwebtoken is the audited
# standard (alg allowlisting, aud/iss/exp validation, JWK decoding) —
# hand-rolled JWT parsing is the classic alg-confusion trap. arc-swap
# provides the lock-free policy/JWKS snapshot swap the request path
# reads (no request performs a synchronous Control Plane lookup).
# 11.x carries the GHSA-h395-gr6q-cpjc fix (SECURITY.md); its crypto
# backend is aws-lc-rs, which rustls and object_store already link, so the
# upgrade adds no crypto crate (rust_crypto would add rsa, p256, p384,
# ed25519-dalek and their trees).
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
arc-swap = "1"

[dev-dependencies]
proptest = "=1.11.0"
loom = "=0.7.2"
# SR-6 identity lint (src/mt_lint.rs): parses the crate's own sources
# and enforces ZERO unmarked residuals for the multitenancy security
# categories. Test-only — never linked into the server binary.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# TLA-005-F5 regression (src/shard/retirement_tests.rs): SlateDB's own
# write failpoints (the feature compiles them into test builds only) and the
# log call inside its batch-writer exit window. Both are already in the graph.
fail-parallel = { version = "0.6", features = ["failpoints"] }
log = { version = "0.4", features = ["std"] }

[[bin]]
name = "streams-slate"
path = "src/main.rs"

[[bin]]
name = "s3lite"
path = "src/bin/s3lite.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
lto = "thin"

# Mutation tests run real assertions with optimization but without release LTO
# or debug-symbol overhead. This profile never changes the shipped binary.
[profile.quality]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[[bin]]
name = "streams-keys"
path = "src/bin/keys.rs"

[[bin]]
name = "livebench"
path = "src/bin/livebench.rs"

[[bin]]
name = "edgesim"
path = "src/bin/edgesim.rs"

[[bin]]
name = "pilot"
path = "src/bin/pilot.rs"

[[bin]]
name = "cryptobench"
path = "src/bin/cryptobench.rs"

[patch.crates-io]
# Prisma's public SlateDB fork (prisma/slatedb, owner's direction 2026-11-01),
# tag streams-20261114-e14e58d: upstream main 0c22c032 (our merged #2193 and
# #2208; #2181; #2120; #2063) plus FORK.md and the patches it lists: #2190,
# #2191, #2010, the uncached-run coalescing of issue #2211, the bounded
# point-lookup lookahead of issue #2213, the single WAL freeze per explicit
# flush of issue #2215, a clone's initial rows as its own L0 table (issue
# #2239, S4's C4), a fresh clone's final checkpoint through the manifest it
# loaded (issue #2240, C3), the writer-ownership check after WAL replay
# (upstream #2231, merged after the base), a clone's WAL check by the source's
# last L0 sequence number (FORK.md patch 10, upstream issue #2263, fixing known issue K1), and FORK.md
# as on the fork's main.
# Every change goes upstream; FORK.md says how a pin moves.
slatedb = { git = "https://github.com/prisma/slatedb.git", rev = "e14e58df812434aedc70440ca09db90da5e97bc1" }
slatedb-common = { git = "https://github.com/prisma/slatedb.git", rev = "e14e58df812434aedc70440ca09db90da5e97bc1" }
# foyer v0.22.6 plus exactly two unreleased upstream fixes, carried on a
# fork until a foyer release has both (then `cargo update -p foyer` and drop
# these lines): foyer-rs/foyer#1345 (release the inflight lock before
# spawning a fetch: a miss polled on a closing runtime deadlocked its
# worker, docs/OPS-RELEASE.md section 1) and foyer-rs/foyer#1382 (zstd
# 0.14.3, the same four advisories). Branch streams/v0.22.6-1345-1382.
foyer = { git = "https://github.com/sorenbs/foyer.git", rev = "87d21072a1926106f983c6b5f01527cf7e635cee" }
foyer-common = { git = "https://github.com/sorenbs/foyer.git", rev = "87d21072a1926106f983c6b5f01527cf7e635cee" }
foyer-memory = { git = "https://github.com/sorenbs/foyer.git", rev = "87d21072a1926106f983c6b5f01527cf7e635cee" }
foyer-storage = { git = "https://github.com/sorenbs/foyer.git", rev = "87d21072a1926106f983c6b5f01527cf7e635cee" }
foyer-tokio = { git = "https://github.com/sorenbs/foyer.git", rev = "87d21072a1926106f983c6b5f01527cf7e635cee" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }

# Structure and explicit contracts
excessive_nesting = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
option_option = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"

# Ownership and hidden failure
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

# Suspicious conversions and avoidable ownership work
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"

# Enforce the canonical effect boundaries below
disallowed_methods = "warn"
allow_attributes_without_reason = "warn"

[workspace]
members = ["tools/quality-syntax", "tools/quality-invariants", "fuzz"]
resolver = "3"

[lints]
workspace = true
