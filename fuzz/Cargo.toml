[package]
name = "streams-quality-fuzz"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# The harness includes the exact production modules via #[path]. Machete only
# scans this package directory, so it cannot see their imports. Removing any of
# these dependencies fails compilation of those unchanged production sources.
[package.metadata.cargo-machete]
ignored = ["aes-gcm", "aes-gcm-siv", "base64", "hkdf", "hmac", "serde", "sha2", "zstd"]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde = "1"
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22.1"
hmac = "0.12"
zstd = "0.13"

[[bin]]
name = "postings"
path = "fuzz_targets/postings.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
