name: ci

on:
  push:
    branches: [main, slate, slate-codex]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint serving and recovery binaries (warnings are errors)
        run: cargo clippy --bin streams-slate --bin streams-restore --bin streams-shard-admin --bin s3lite -- -D warnings
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --release
      - name: Smoke (restart safety and recovery against s3lite)
        run: |
          cargo build --release --bin s3lite --bin streams-slate --bin streams-keys --bin streams-restore --bin streams-shard-admin
          bash scripts/ci-smoke.sh
          bash scripts/ci-backup-restore.sh
          bash scripts/ci-object-store-faults.sh
          bash scripts/ci-corruption-stale.sh
          bash scripts/ci-shard-split.sh
          bash scripts/ci-online-shard-split.sh
          bash scripts/ci-auto-shard-split.sh
          bash scripts/ci-split-stale-owner.sh
          bash scripts/ci-split-crash-matrix.sh
          bash scripts/ci-online-shard-merge.sh
          bash scripts/ci-merge-stale-owner.sh
          bash scripts/ci-merge-crash-matrix.sh
          bash scripts/ci-merge-takeover-gc.sh
          bash scripts/ci-split-merge-race.sh
          bash scripts/ci-jwt-multitenant.sh
          bash scripts/ci-durable-quotas.sh
          bash scripts/ci-noisy-neighbor.sh
          bash scripts/ci-conformance.sh
