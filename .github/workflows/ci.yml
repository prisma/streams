name: ci

on:
  push:
    branches: [main, slate]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --release
      - name: Smoke (create/append/read against s3lite)
        run: |
          cargo build --release --bin s3lite --bin streams-slate --bin streams-keys
          ./target/release/s3lite --listen 127.0.0.1:9500 --latency-ms 2 &
          sleep 1
          KEY=$(./target/release/streams-keys generate)
          ./target/release/streams-slate --listen 127.0.0.1:8090 \
            --s3-endpoint http://127.0.0.1:9500 --bucket streams --region auto \
            --access-key-id test --secret-access-key test \
            --path-prefix ci --initial-shards 4 --auth-token citoken &
          sleep 2
          curl -fsS http://127.0.0.1:8090/health
          curl -fsS -X PUT http://127.0.0.1:8090/v1/stream/ci-smoke \
            -H "authorization: Bearer citoken" -H "Stream-Encryption-Key: $KEY" \
            -H 'content-type: application/json' -d '{}'
          curl -fsS -X POST http://127.0.0.1:8090/v1/stream/ci-smoke \
            -H "authorization: Bearer citoken" -H "Stream-Encryption-Key: $KEY" \
            -H 'content-type: application/json' -d '{"events":[{"data":{"n":1}}]}'
          curl -fsS http://127.0.0.1:8090/v1/stream/ci-smoke \
            -H "authorization: Bearer citoken" -H "Stream-Encryption-Key: $KEY" \
            | grep -F '"n":1'
